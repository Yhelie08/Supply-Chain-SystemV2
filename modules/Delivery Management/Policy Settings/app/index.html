<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  /* Own Creator page, no module sidebar — collapse the shell's two-column grid. */
  .app{grid-template-columns:minmax(0,1fr)}

  /* The design's .pol-row is a dense 2-column read-only block. This screen is
     read at a glance by someone deciding whether a number looks right, so the
     row is re-cut: human label first, value as the hero, the technical key
     demoted to a subtitle, and the long explanation moved into the Edit modal.
     One column, full width, so nothing is clipped on a narrow Creator page. */
  .pol-grid{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .pol{border:0;border-radius:0}
  .pol h3{position:sticky;top:0;z-index:1}
  .pol-row{grid-template-columns:minmax(0,1fr) auto auto;gap:1px 18px;padding:13px 16px}
  .pol-row .lbl{grid-column:1;grid-row:1;font-size:var(--fs-lg);font-weight:600}
  .pol-row .k{grid-column:1;grid-row:2;font-size:var(--fs-xs);color:var(--faint);font-weight:400}
  .pol-row .d{grid-column:1;grid-row:3;font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
  .pol-row .v{grid-column:2;grid-row:1/4;align-self:center;text-align:right;white-space:nowrap;
              font-size:var(--fs-xl);font-weight:700;font-variant-numeric:tabular-nums}
  .pol-row .act{grid-column:3;grid-row:1/4;align-self:center;display:flex;gap:6px}
  .pol-row.missing{background:var(--warn-soft)}
  .pol-row.missing .v{color:var(--warn)}
  .fallback{display:block;font-size:var(--fs-xs);color:var(--warn);font-weight:500}

  /* The other keys are reference rows, not controls — kept tight so 27 of them
     stay scannable. */
  .pol-row.compact{padding:10px 16px}
  .pol-row.compact .lbl{font-size:var(--fs-md)}
  .pol-row.compact .v{font-size:var(--fs-md);font-weight:600}

  .effect{margin-top:8px;padding:9px 11px;border-radius:9px;background:var(--surface-2);
          color:var(--muted);font-size:var(--fs-sm)}
  .about{color:var(--muted);font-size:var(--fs-sm);margin:0}
  .warnbar{display:flex;gap:10px;align-items:flex-start;margin:12px 16px 0;padding:11px 13px;
           background:var(--warn-soft);color:var(--warn);border-radius:10px;font-size:var(--fs-md)}

  @media (max-width:640px){
    .pol-row{grid-template-columns:minmax(0,1fr) auto}
    .pol-row .v{grid-column:2;grid-row:1/3}
    .pol-row .act{grid-column:1/-1;grid-row:4;margin-top:8px}
  }
</style>
</head>

<div class="app">
  <div class="main">
    <div class="main-in">

        </div>
        <div class="top-actions">

            <input id="q" type="search" placeholder="Search key or description…" autocomplete="off" aria-label="Search policy settings" />
          </label>
          <button class="btn" id="btnRefresh" type="button" style="height:38px">Refresh</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>

</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Policy details" inert></aside>

<!-- Prelude: everything dms-ui.js expects to already exist. Kept in its own
     script so the shared file stays byte-identical to
     _shared/design/dms-ui.js (MODULE_MAP.md §2). -->
<script>
const $ = function(s, r){ return (r || document).querySelector(s); };
const $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
const IC = {
  view: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  fail: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  feedback: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  prev: '<path d="m15 6-6 6 6 6"/>',
  next: '<path d="m9 6 6 6-6 6"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  empty: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 15h8"/>'
};
let drawerOpener = null, modalOpener = null, modalSeq = 0;
</script>
<script src="dms-ui.js"></script>

<script>
/* ============================================================================
   Policy Settings — the control panel for the four global numbers the DMS
   scheduling engine reads. Form `Policy_Settings`, report `All_Policy_Settings`
   (both verbatim from `DMS IDE/Policy_setting`); fields Policy_Key, Description,
   Value, Type_field, Last_Updated_By, Last_Updated_Date.

   WHY THIS EXISTS: every one of those four reads in the engine has a hardcoded
   fallback, so a missing record is invisible — the engine quietly runs on my
   default instead of yours. This screen shows which keys are actually set,
   which are falling back, and lets the numbers be changed without a Deluge
   paste.

   WHAT EACH KEY REALLY DOES (traced in the engine, not assumed):
     traffic_buffer_percent      engine line 366 -> bufferedDuration =
                                 estDuration x (1 + pct/100). This is what
                                 widens the gap between one stop and the next.
     max_days_scheduling_window  line 378 -> how many days the slot search
                                 covers before returning "Calendar Full".
     workday_start_time /        lines 386-414 -> end minus start = workdayHours,
     workday_end_time            used as the overtime threshold (line 546) AND
                                 as the capacity of a team whose
                                 Max_Capacity_Hours is blank (line 470, FIX 4).

   WHAT THESE KEYS DO *NOT* DO: workday_start_time is NOT the suggested start
   time any more. That moved to each team's own `Start_Time1` on
   Daily_Team_Availability on 2026-09-11, deliberately, with no Policy fallback
   (engine line 611 falls back to a hardcoded "8:00 AM"). The screen says so,
   because this is the single most-repeated confusion in this module.

   TIME FORMAT IS LOAD-BEARING: the engine parses the value with
   `Value.toList(" ")` then `.toList(":")`, so it must read `8:00 AM` — with the
   space. `8:00AM` silently falls back to 9 hours and nothing reports it. The
   time inputs here are native <input type="time"> and the 12-hour string is
   rebuilt on save by fmt12()/to24() from dms-ui.js, so the shape cannot be
   typed wrong.

   SCOPE, set by the user 2026-10-26 ("ito lang ang kailangan, the rest
   tanggalin muna"): only the four engine keys are listed. The other
   Policy_Settings records still exist in Zoho untouched \u2014 this screen just
   does not show them. Restoring the list means putting back otherRow(), the
   second panel in render(), and the New policy button, all removed together.

   SDK notes, same as every other DMS widget:
     - SDK 2.0, ZOHO.CREATOR.DATA.*
     - NO blocking ZOHO.CREATOR.init() — it never resolves (Widget/DMS/CLAUDE.md,
       2026-09-18: it is what left DailyChecklistVehicle stuck on "Loading...").
     - max_records only accepts 200 / 500 / 1000 (code 9250 otherwise).
     - A failed call can carry its code inside a JSON-stringified responseText,
       so errInfo() digs it out instead of showing a bare "Code ?".
   ========================================================================= */

const REPORT_NAME = 'All_Policy_Settings';
const FORM_NAME   = 'Policy_Settings';

/* Verbatim from the form export. */
const TYPE_CHOICES = ['Time','Number','Boolean','Percentage','Text','Dropdown List'];

/* The four keys the engine actually reads. `fallback` is the literal default
   in the engine when the record is missing or blank — shown on screen so it is
   obvious what is running right now. */
const ENGINE_KEYS = [
  { key:'traffic_buffer_percent', type:'Percentage', fallback:'15', unit:'%',
    label:'Traffic buffer',
    short:'Travel time added to every job',
    desc:'Extra time added to every job for travel, as a percentage of the job itself. Raise it when routes are long or traffic is heavy; lower it when deliveries are close together.',
    input:'number', min:0, max:100, step:'1' },
  { key:'max_days_scheduling_window', type:'Number', fallback:'14', unit:' days',
    label:'Scheduling window',
    short:'How far ahead the engine looks for a slot',
    desc:'How far out the engine is allowed to book. A smaller window makes it give up sooner and raise an exception instead of quietly scheduling weeks away.',
    input:'number', min:1, max:60, step:'1' },
  { key:'workday_start_time', type:'Time', fallback:'8:00 AM', unit:'',
    label:'Workday start',
    short:'Start of the standard workday — not the suggested time (that is per team)',
    desc:'Start of the standard workday. With the end time it sets the day length used for the overtime check and for any team left without Max Capacity Hours. It does NOT set the suggested time \u2014 that comes from each team\u2019s own Start Time in Daily Team Availability.',
    input:'time' },
  { key:'workday_end_time', type:'Time', fallback:'5:00 PM', unit:'',
    label:'Workday end',
    short:'End of the standard workday',
    desc:'End of the standard workday. With the start time it sets the day length used for the overtime check.',
    input:'time' }
];

let ALL = [];
let BUSY = false;

/* ---------------- shell plumbing the shared file calls ---------------- */
function syncInert(){
  $('#modal').toggleAttribute('inert', !$('#modal').classList.contains('on'));
  $('#drawer').toggleAttribute('inert', !$('#drawer').classList.contains('on'));
}
function restoreFocus(el){ if(el && el.isConnected && el.focus) setTimeout(function(){ el.focus({ preventScroll:true }); }, 30); }
function closeModal(){
  var m = $('#modal');
  m.className = 'modal'; m.innerHTML = '';
  if(!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on');
  syncInert(); restoreFocus(modalOpener);
}
function closeDrawer(){
  var d = $('#drawer');
  d.className = 'drawer'; d.innerHTML = '';
  if(!$('#modal').classList.contains('on')) $('#scrim').classList.remove('on');
  syncInert(); restoreFocus(drawerOpener);
}

/* ---------------- errors ---------------- */
/* Zoho returns a failed call in several shapes; the real code is sometimes
   inside a JSON-stringified responseText. Without this a genuine error shows
   up as "Code ?" with nothing to act on. */
function errInfo(e){
  var o = e, msg = '';
  if(o && typeof o.responseText === 'string'){
    try { o = JSON.parse(o.responseText); } catch(_err){ msg = o.responseText; o = e; }
  } else if(o && o.responseText && typeof o.responseText === 'object'){
    o = o.responseText;
  }
  var code = (o && (o.code || o.status)) || (e && e.code) || '';
  if(!msg){
    if(o && o.message) msg = o.message;
    else if(o && o.description) msg = o.description;
    else if(o && o.error) msg = (Object.prototype.toString.call(o.error) === '[object Array]' ? o.error.join('; ') : String(o.error));
    else if(o && o.data && (o.data.message || o.data.error)) msg = String(o.data.message || o.data.error);
    else { try { msg = JSON.stringify(e); } catch(_err2){ msg = String(e); } }
  }
  return { code: String(code || ''), msg: String(msg || '') };
}

/* ---------------- read ---------------- */
function txt(v){ return (v === null || v === undefined) ? '' : String(v); }

function mapRow(r){
  return {
    raw: r,
    id: String(r.ID),
    key: txt(r.Policy_Key).trim(),
    desc: txt(r.Description),
    value: txt(r.Value).trim(),
    type: txt(r.Type_field),
    by: txt(r.Last_Updated_By),
    at: txt(r.Last_Updated_Date)
  };
}

function load(){
  if(typeof ZOHO === 'undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.DATA || typeof ZOHO.CREATOR.DATA.getRecords !== 'function'){
    console.error('[PolicySettings] SDK not available');
    $('#view').innerHTML = emptyState('Widget SDK not available', 'Open this page inside Zoho Creator.');
    return;
  }
  $('#view').innerHTML = '<section class="panel"><div class="panel-head"><h2>Loading…</h2></div><div style="padding:22px">' + emptyState('Reading the Policy Settings report…', '') + '</div></section>';
  ZOHO.CREATOR.DATA.getRecords({
    report_name: REPORT_NAME,
    page: 1,
    pageSize: 200,
    field_config: 'all'
  }).then(function(resp){
    var ok = resp && (resp.code === 3000 || String(resp.code) === '3000');
    if(!ok){
      var RE = errInfo(resp);
      /* 9220 is Creator's "no records" code, not a failure. */
      if(String(RE.code) === '9220'){ ALL = []; render(); return; }
      console.error('[PolicySettings] getRecords not 3000', resp);
      $('#view').innerHTML = emptyState('Could not read the policy settings',
        'Code ' + (RE.code || '?') + '. ' + (RE.msg || 'No details came back from Zoho.'));
      return;
    }
    var rows = resp.data || [];
    console.log('[PolicySettings] getRecords rows:', rows.length);
    ALL = rows.map(mapRow);
    render();
  }).catch(function(e){
    var EI = errInfo(e);
    if(String(EI.code) === '9220'){ ALL = []; render(); return; }
    console.error('[PolicySettings] getRecords error', e);
    $('#view').innerHTML = emptyState('Could not read the policy settings',
      (EI.code ? 'Code ' + EI.code + '. ' : '') + (EI.msg || 'No details came back from Zoho.') +
      ' | 2893 = maling report name, 2945 = expired ang session (mag-sign out at sign in ulit).');
  });
}

/* ---------------- lookups ---------------- */
function rowsForKey(k){
  var want = String(k).toLowerCase();
  return ALL.filter(function(o){ return o.key.toLowerCase() === want; });
}
function rowById(id){ return ALL.filter(function(o){ return o.id === String(id); })[0]; }
function specFor(k){
  var want = String(k).toLowerCase();
  return ENGINE_KEYS.filter(function(s){ return s.key.toLowerCase() === want; })[0] || null;
}
/* What the engine is using right now: the record's value if it has one,
   otherwise the engine's own hardcoded fallback. */
function effective(spec){
  var r = rowsForKey(spec.key)[0];
  if(r && r.value) return { value:r.value, live:true, row:r };
  return { value:spec.fallback, live:false, row:r || null };
}

/* ---------------- render ---------------- */
const LOCK = '<svg class="lock" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function matches(o, q){
  if(!q) return true;
  return (o.key + ' ' + o.desc + ' ' + o.value).toLowerCase().indexOf(q) !== -1;
}

function engineRow(spec, q){
  var eff = effective(spec);
  if(!matches({ key:spec.key, desc:spec.label + ' ' + spec.short, value:eff.value }, q)) return '';
  var act = eff.row
    ? '<button class="btn sm" type="button" data-edit="' + esc(eff.row.id) + '">Edit</button>'
    : '<button class="btn sm primary" type="button" data-create="' + esc(spec.key) + '">Set it</button>';
  return '<div class="pol-row' + (eff.live ? '' : ' missing') + '">' +
    '<div class="lbl">' + esc(spec.label) + '</div>' +
    '<div class="k mono">' + esc(spec.key) + '</div>' +
    '<div class="d">' + esc(spec.short) + '</div>' +
    '<div class="v">' + esc(eff.value) + esc(spec.unit || '') +
      (eff.live ? '' : '<span class="fallback">not set</span>') +
    '</div>' +
    '<div class="act">' + act + '</div>' +
  '</div>';
}

/* A second record for the same key is a real trap: the engine's
   `Policy_Settings[Policy_Key == "x"]` takes one row and the other is simply
   never read, with nothing on screen to say so. */
function duplicateWarning(){
  var dupes = [];
  ENGINE_KEYS.forEach(function(s){
    var n = rowsForKey(s.key).length;
    if(n > 1) dupes.push(s.key + ' (' + n + ')');
  });
  if(!dupes.length) return '';
  return '<div class="warnbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="flex:none;margin-top:1px"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17h.01"/></svg>' +
    '<div>More than one record exists for: <b>' + esc(dupes.join(', ')) + '</b>. The engine reads only one of them and never reports which — delete the extras in the native form.</div></div>';
}

function render(){
  var q = ($('#q').value || '').trim().toLowerCase();

  var engineRows = ENGINE_KEYS.map(function(s){ return engineRow(s, q); }).join('');

  var html = '<section class="panel">' +
    '<div class="panel-head"><h2>Scheduling engine</h2>' +
      '<span class="hint">Read on every scheduling run</span></div>' +
    duplicateWarning() +
    '<div class="notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>' +
      '<div>Amber means no record exists yet \u2014 the engine is running on the value shown. ' +
      'Open Edit for what each one does.</div></div>' +
    '<div class="pol-grid"><div class="pol">' +
      (engineRows || '<div class="pol-row"><div class="k">—</div><div class="v"></div><div class="act"></div><div class="d">Nothing matches that search.</div></div>') +
    '</div></div></section>';

  $('#view').innerHTML = html;

  $$('[data-edit]').forEach(function(b){ b.onclick = function(){ openEdit(b.getAttribute('data-edit')); }; });
  $$('[data-create]').forEach(function(b){ b.onclick = function(){ openCreate(b.getAttribute('data-create')); }; });
}

/* ---------------- form fields ---------------- */
function valueField(spec, current){
  if(!spec){
    return '<div class="field"><label>Value</label>' +
      '<input type="text" name="Value" value="' + esc(current || '') + '"></div>';
  }
  if(spec.input === 'time'){
    return '<div class="field"><label>Value <span class="req">*</span></label>' +
      '<input type="time" name="ValueTime" value="' + esc(to24(current || spec.fallback)) + '" data-required>' +
      '</div>';
  }
  return '<div class="field"><label>Value <span class="req">*</span></label>' +
    '<input type="number" name="ValueNum" value="' + esc(current || spec.fallback) + '" ' +
      'min="' + spec.min + '" max="' + spec.max + '" step="' + spec.step + '" data-required>' +
    '</div>';
}

/* Live sentence under the input so the number means something before saving. */
function effectText(key, raw){
  if(key === 'traffic_buffer_percent'){
    var p = parseFloat(raw);
    if(isNaN(p)) return 'Enter a number from 0 to 100.';
    return 'A 2-hour job will be counted as ' + (2 * (1 + p / 100)).toFixed(2).replace(/\.?0+$/, '') +
           ' hours against the team’s day.';
  }
  if(key === 'max_days_scheduling_window'){
    var d = parseInt(raw, 10);
    if(isNaN(d)) return 'Enter a whole number of days.';
    return 'The engine searches today plus the next ' + (d - 1) + ' day' + (d - 1 === 1 ? '' : 's') +
           ', then returns “Calendar Full”.';
  }
  if(key === 'workday_start_time' || key === 'workday_end_time'){
    var startSpec = specFor('workday_start_time'), endSpec = specFor('workday_end_time');
    var s = key === 'workday_start_time' ? raw : effective(startSpec).value;
    var e = key === 'workday_end_time' ? raw : effective(endSpec).value;
    var mins = toMin(to24(e)) - toMin(to24(s));
    if(!(mins > 0)) return 'The end time has to be after the start time.';
    return 'Workday length becomes ' + (mins / 60).toFixed(2).replace(/\.?0+$/, '') +
           ' hours (' + esc(s) + ' to ' + esc(e) + '). Used for the overtime check and for any team with no Max Capacity Hours.';
  }
  return '';
}

function wireEffect(key){
  var f = $('#modal form');
  if(!f) return;
  var box = f.querySelector('.effect');
  var inp = f.querySelector('[name=ValueNum],[name=ValueTime]');
  if(!box || !inp) return;
  var paint = function(){
    var raw = inp.type === 'time' ? fmt12(toMin(inp.value || '00:00')) : inp.value;
    box.textContent = effectText(key, raw);
  };
  inp.addEventListener('input', paint);
  inp.addEventListener('change', paint);
  paint();
}

/* ---------------- validate ---------------- */
/* Returns the string to store, or null after showing why not. The engine
   parses these values with plain string splits, so the shape matters as much
   as the number. */
function valueToStore(spec, data){
  if(!spec) return String(data.Value || '').trim();

  if(spec.input === 'time'){
    var t24 = String(data.ValueTime || '').trim();
    if(!/^\d{1,2}:\d{2}$/.test(t24)){ toast('Pick a time first', 'warn'); return null; }
    var out = fmt12(toMin(t24));              /* always "8:00 AM", with the space */
    var otherKey = spec.key === 'workday_start_time' ? 'workday_end_time' : 'workday_start_time';
    var otherVal = effective(specFor(otherKey)).value;
    var startM = spec.key === 'workday_start_time' ? toMin(t24) : toMin(to24(otherVal));
    var endM   = spec.key === 'workday_end_time'   ? toMin(t24) : toMin(to24(otherVal));
    if(!(endM > startM)){
      toast('Workday end has to be after workday start', 'warn');
      return null;
    }
    return out;
  }

  var n = Number(String(data.ValueNum).trim());
  if(!isFinite(n)){ toast('Enter a number', 'warn'); return null; }
  if(n < spec.min || n > spec.max){
    toast(spec.label + ' has to be between ' + spec.min + ' and ' + spec.max, 'warn');
    return null;
  }
  if(spec.input === 'number' && spec.step === '1' && Math.floor(n) !== n){
    toast(spec.label + ' has to be a whole number', 'warn');
    return null;
  }
  return String(n);
}

/* ---------------- write ---------------- */
/* Zoho's own datetime shape. Sent with the save, and dropped on a retry if the
   field rejects it, so a stamping problem can never cost the actual value. */
function stampNow(){
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var d = new Date();
  return pad(d.getDate()) + '-' + M[d.getMonth()] + '-' + d.getFullYear() + ' ' +
         pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function describe(code){
  if(String(code) === '2945') return 'Session expired — refresh the page and try again';
  if(String(code) === '3001') return 'A field did not accept its value';
  if(String(code) === '3002') return 'A field did not accept its format';
  if(String(code) === '2893') return 'Form or report name is wrong';
  return 'Nothing was changed';
}

function saveRecord(id, data, okMsg){
  if(BUSY) return;
  BUSY = true;
  var stamped = Object.assign({}, data, { Last_Updated_Date: stampNow() });
  var attempt = function(payload, isRetry){
    return ZOHO.CREATOR.DATA.updateRecordById({
      report_name: REPORT_NAME,
      id: String(id),
      payload: { data: payload }
    }).then(function(resp){
      var ok = resp && (resp.code === 3000 || String(resp.code) === '3000');
      if(!ok){
        if(!isRetry){ console.warn('[PolicySettings] retrying without Last_Updated_Date', resp); return attempt(data, true); }
        var RI = errInfo(resp);
        console.error('[PolicySettings] update failed', resp);
        toast('Save failed (code ' + (RI.code || '?') + ') — ' + (RI.msg || describe(RI.code)), 'bad');
        BUSY = false; return;
      }
      BUSY = false;
      toast(okMsg, 'ok'); announce(okMsg);
      closeModal(); load();
    }).catch(function(e){
      if(!isRetry){ console.warn('[PolicySettings] retrying without Last_Updated_Date', e); return attempt(data, true); }
      var EI = errInfo(e);
      console.error('[PolicySettings] update error', e);
      toast('Save failed' + (EI.code ? ' (code ' + EI.code + ')' : '') + ' — ' + (EI.msg || describe(EI.code)), 'bad');
      BUSY = false;
    });
  };
  attempt(stamped, false);
}

function addRecord(data, okMsg){
  if(BUSY) return;
  BUSY = true;
  var stamped = Object.assign({}, data, { Last_Updated_Date: stampNow() });
  var attempt = function(payload, isRetry){
    return ZOHO.CREATOR.DATA.addRecords({
      form_name: FORM_NAME,
      payload: { data: [payload] }
    }).then(function(resp){
      var ok = resp && (resp.code === 3000 || String(resp.code) === '3000');
      if(!ok){
        if(!isRetry){ console.warn('[PolicySettings] retrying without Last_Updated_Date', resp); return attempt(data, true); }
        var RI = errInfo(resp);
        console.error('[PolicySettings] add failed', resp);
        toast('Could not add (code ' + (RI.code || '?') + ') — ' + (RI.msg || describe(RI.code)), 'bad');
        BUSY = false; return;
      }
      BUSY = false;
      toast(okMsg, 'ok'); announce(okMsg);
      closeModal(); load();
    }).catch(function(e){
      if(!isRetry){ console.warn('[PolicySettings] retrying without Last_Updated_Date', e); return attempt(data, true); }
      var EI = errInfo(e);
      console.error('[PolicySettings] add error', e);
      toast('Could not add' + (EI.code ? ' (code ' + EI.code + ')' : '') + ' — ' + (EI.msg || describe(EI.code)), 'bad');
      BUSY = false;
    });
  };
  attempt(stamped, false);
}

/* ---------------- modals ---------------- */
function openEdit(id){
  var o = rowById(id);
  if(!o) return;
  var spec = specFor(o.key);
  showModal(
    '<header><h3>' + esc(spec ? spec.label : (o.key || 'Policy')) + '</h3>' +
      '<p class="mono">' + esc(o.key || '—') + '</p></header>' +
    '<form novalidate>' +
        (spec ? '' : '<div class="field"><label>Policy Key <span class="req">*</span></label><input type="text" name="Policy_Key" value="' + esc(o.key) + '" data-required></div>') +
        valueField(spec, o.value) +
        (spec ? '<div class="effect"></div>' : '') +
        (spec ? '<p class="about">' + esc(spec.desc) + '</p>' : '') +
        '<div class="field"><label>Description</label><textarea name="Description" rows="2">' + esc(o.desc) + '</textarea></div>' +
        fSelect('Type', 'Type_field', TYPE_CHOICES, o.type || (spec ? spec.type : ''), { blank:'—' }) +
      '<div class="m-foot"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Save</button></div>' +
    '</form>',
    function(data){
      var v = valueToStore(spec, data);
      if(v === null) return false;
      var payload = { Value: v, Description: String(data.Description || '').trim(), Type_field: data.Type_field || '' };
      if(!spec){
        var k = String(data.Policy_Key || '').trim();
        if(!k){ toast('Policy Key is required', 'warn'); return false; }
        payload.Policy_Key = k;
      }
      saveRecord(o.id, payload, (spec ? spec.label : k || 'Policy') + ' saved');
      return false;   /* saveRecord closes the modal once Zoho confirms */
    }
  );
  if(spec) wireEffect(spec.key);
}

function openCreate(key){
  var spec = specFor(key);
  if(!spec) return;
  showModal(
    '<header><h3>Set ' + esc(spec.label) + '</h3>' +
      '<p>No record exists yet, so the engine is using ' + esc(spec.fallback) + esc(spec.unit || '') + '.</p></header>' +
    '<form novalidate>' +
        '<div class="field"><label>Policy Key</label><input type="text" value="' + esc(spec.key) + '" readonly class="ro"></div>' +
        valueField(spec, '') +
        '<div class="effect"></div>' +
        '<div class="field"><label>Description</label><textarea name="Description" rows="3">' + esc(spec.desc) + '</textarea></div>' +
      '<div class="m-foot"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn primary">Create</button></div>' +
    '</form>',
    function(data){
      var v = valueToStore(spec, data);
      if(v === null) return false;
      addRecord({
        Policy_Key: spec.key,
        Value: v,
        Description: String(data.Description || '').trim(),
        Type_field: spec.type
      }, spec.label + ' created');
      return false;
    }
  );
  wireEffect(spec.key);
}

/* ---------------- boot ---------------- */
$('#q').addEventListener('input', render);
$('#btnRefresh').onclick = load;
$('#scrim').onclick = function(){
  if($('#modal').classList.contains('on')) closeModal();
  if($('#drawer').classList.contains('on')) closeDrawer();
};
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if($('#modal').classList.contains('on')) closeModal();
    else if($('#drawer').classList.contains('on')) closeDrawer();
  }
  if(e.key === 'Tab' && ($('#modal').classList.contains('on') || $('#drawer').classList.contains('on'))) trapFocus(e);
});
load();
</script>
