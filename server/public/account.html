<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password – Supply Chain App</title>
<script src="/theme/theme-init.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0c10'/%3E%3Cpath d='M16 4v6' stroke='%23aab2c0' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0z' fill='%23ff7a1a'/%3E%3Cpath d='M11 24.5h10' stroke='%232fe38f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/theme/pages.css">
<link rel="stylesheet" href="/theme/liquid.css">
</head>
<body>
<div class="topbar">
  <svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs><path d="M17 2v8" stroke="#aab2c0" stroke-width="1.6" stroke-linecap="round"/><path d="M6 22a11 11 0 0 1 22 0z" fill="url(#dome)"/><path d="M11 27.5h12" stroke="#2fe38f" stroke-width="2.2" stroke-linecap="round"/></svg>
  Supply Chain App
  <span data-theme-toggle></span>
  <a class="back" href="/" id="back">Back to the app</a>
</div>
<div class="rail"></div>
<main>
  <form class="panel narrow" id="form">
    <h1>Change password</h1>
    <p class="lede" id="lede">Signed in as <strong id="email"></strong>.</p>
    <p class="note warn" id="first" hidden>You signed in with a temporary password. Choose your own to continue.</p>
    <label for="current">Current password</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="next">New password</label>
    <input id="next" type="password" autocomplete="new-password" minlength="10" required aria-describedby="rule">
    <p class="help" id="rule" style="margin-top:6px">At least 10 characters.</p>
    <label for="again">New password again</label>
    <input id="again" type="password" autocomplete="new-password" minlength="10" required>
    <p class="note" id="msg" role="status" hidden></p>
    <button class="btn primary full" type="submit">Save new password</button>
  </form>
</main>
<script>
  var first = new URLSearchParams(location.search).get('first') === '1';
  var $ = function (id) { return document.getElementById(id); };
  $('first').hidden = !first;
  $('back').hidden = first;
  fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
    if (!me) { location.href = '/login'; return; }
    $('email').textContent = me.email;
  });
  function say(kind, text) { var m = $('msg'); m.className = 'note ' + kind; m.textContent = text; m.hidden = false; }
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('next').value !== $('again').value) return say('bad', 'The two new passwords are different. Type the same one twice.');
    fetch('/api/account/password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: $('current').value, next: $('next').value }),
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); }).then(function (x) {
      if (!x.ok) return say('bad', x.b.message || 'Could not change the password.');
      if (first) { location.href = '/'; return; }
      $('form').reset();
      say('ok', 'Password changed.');
    }).catch(function () { say('bad', 'Could not reach the server. Check your connection and try again.'); });
  });
</script>
</body>
</html>
