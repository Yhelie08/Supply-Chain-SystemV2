<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme/theme-init.js"></script>
<title>Sign in – Supply Chain App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0c10'/%3E%3Cpath d='M16 4v6' stroke='%23aab2c0' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0z' fill='%23ff7a1a'/%3E%3Cpath d='M11 24.5h10' stroke='%232fe38f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/theme/pages.css">
</head>
<body>
<div class="login-tools"><span data-theme-toggle></span></div>
<main class="login">
  <div class="lamp" aria-hidden="true">
    <div class="cone"></div>
    <svg viewBox="0 0 220 270">
      <defs>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb877"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d8540a"/></linearGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4e0"/><stop offset=".35" stop-color="#ffc07a" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
      </defs>
      <path d="M110 0v118" stroke="#8a93a2" stroke-width="2" stroke-linecap="round"/>
      <rect x="104" y="108" width="12" height="14" rx="3" fill="#aab2c0"/>
      <path d="M52 200a58 58 0 0 1 116 0z" fill="url(#shade)"/>
      <path d="M52 200a58 58 0 0 1 58-22" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round" transform="translate(0 -2)"/>
      <ellipse cx="110" cy="200" rx="58" ry="6" fill="#a53f06"/>
      <g class="bulb"><circle cx="110" cy="214" r="34" fill="url(#glow)"/><circle cx="110" cy="206" r="9" fill="#fff4e0"/></g>
      <path d="M84 232h52" stroke="#2fe38f" stroke-width="2.4" stroke-linecap="round" opacity=".0"/>
    </svg>
  </div>
  <form class="panel narrow" method="post" action="/login">
    <h1>Sign in</h1>
    <p class="lede">Home Cartel's supply chain: procurement, fulfillment and delivery.</p>
    <p class="note bad" id="err" role="alert" hidden></p>
    <input type="hidden" name="next" id="next">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary full" type="submit">Sign in</button>
    <p class="help">Forgot your password? Ask an admin to reset it.</p>
  </form>
</main>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/';
  var e = q.get('e');
  if (e) {
    var el = document.getElementById('err');
    el.textContent = e === 'locked' ? 'Too many wrong attempts. Wait 15 minutes, then try again.' : 'That email and password do not match an active account.';
    el.hidden = false;
  }
</script>
</body>
</html>
