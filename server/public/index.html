<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme/theme-init.js"></script>
<title>Supply Chain App</title>
<link rel="preload" href="/theme/fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0c10'/%3E%3Cpath d='M16 4v6' stroke='%23aab2c0' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M7 20a9 9 0 0 1 18 0z' fill='%23ff7a1a'/%3E%3Cpath d='M11 24.5h10' stroke='%232fe38f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: "Overpass"; src: url("/theme/fonts/overpass-latin.woff2") format("woff2"); font-weight: 300 800; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "Overpass"; src: url("/theme/fonts/overpass-latin-ext.woff2") format("woff2"); font-weight: 300 800; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }

  :root {
    color-scheme: dark;
    --void: #07090d; --void-2: #0c1016;
    --glass: rgba(255, 255, 255, .045); --glass-2: rgba(255, 255, 255, .085);
    --edge: rgba(255, 255, 255, .10); --edge-2: rgba(255, 255, 255, .18);
    --ink: #f1f3f8; --ink-2: #aab2c0; --ink-3: #8a93a2;
    --ember: #ff7a1a; --ember-hot: #ffa14a; --ember-ink: #1c0d02;
    --signal: #2fe38f; --signal-ink: #04170d;
    --rail: 244px;
    --font: "Overpass", "Segoe UI", system-ui, sans-serif;
    --ember-t: #ffa14a; --signal-t: #2fe38f;   /* the same two lights as text colour (deeper on white in light mode) */
    --zone: var(--ember); --zone-t: var(--ember-t);   /* the current room's light: ember for operations, signal for partners */
    --pane: linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .035));
    --pane-stage: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
    --pane-menu: rgba(18, 22, 30, .88);
    --shadow-pane: 0 24px 60px rgba(0, 0, 0, .45); --shadow-stage: 0 30px 80px rgba(0, 0, 0, .5);
    --shadow-menu: 0 24px 60px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .08);
    --hi: rgba(255, 255, 255, .10); --dots: rgba(255, 255, 255, .16);
    --lamp-a: rgba(255, 122, 26, .30); --lamp-b: rgba(47, 227, 143, .20); --lamp-c: rgba(255, 122, 26, .08);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  /* Light mode: daylight in the same room. */
  :root[data-theme="light"] {
    color-scheme: light;
    --void: #e3e8f1; --glass: rgba(255, 255, 255, .6); --glass-2: rgba(255, 255, 255, .92);
    --edge: rgba(20, 30, 50, .10); --edge-2: rgba(20, 30, 50, .18);
    --ink: #141a26; --ink-2: #475163; --ink-3: #5b6578;
    --ember-t: #b8480a; --signal-t: #0b8a55;
    --pane: linear-gradient(180deg, rgba(255, 255, 255, .86), rgba(255, 255, 255, .6));
    --pane-stage: linear-gradient(180deg, rgba(255, 255, 255, .30), rgba(255, 255, 255, .12));
    --pane-menu: rgba(255, 255, 255, .94);
    --shadow-pane: 0 24px 60px rgba(30, 40, 70, .16); --shadow-stage: 0 30px 80px rgba(30, 40, 70, .16);
    --shadow-menu: 0 24px 60px rgba(30, 40, 70, .25), inset 0 1px 0 #fff;
    --hi: rgba(255, 255, 255, .9); --dots: rgba(20, 30, 50, .16);
    --lamp-a: rgba(255, 138, 52, .55); --lamp-b: rgba(47, 227, 143, .46); --lamp-c: rgba(255, 170, 90, .34);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--void); color: var(--ink); font: 14px/1.4 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
  :focus-visible { outline: 2px solid var(--zone); outline-offset: 2px; }
  ::selection { background: var(--ember); color: var(--ember-ink); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* The room: two lamps behind the glass, and a faint dot grid that fades out toward the middle. */
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 46vmax at 4% -8%, var(--lamp-a), transparent 62%),
      radial-gradient(52vmax 40vmax at 104% 108%, var(--lamp-b), transparent 60%),
      radial-gradient(36vmax 30vmax at 70% -20%, var(--lamp-c), transparent 70%),
      var(--void); }
  .ambient::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(var(--dots) 1px, transparent 1.2px); background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(70% 60% at 50% 50%, transparent 20%, #000 100%); mask-image: radial-gradient(70% 60% at 50% 50%, transparent 20%, #000 100%); }

  .app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; transition: grid-template-columns .28s var(--ease); }
  .app.slim { --rail: 76px; }

  /* ---------- rail: the rooms ---------- */
  .rail { display: flex; flex-direction: column; min-height: 0; padding: 18px 12px 14px; margin: 12px 0 12px 12px;
    background: var(--pane);
    border: 1px solid var(--edge); border-radius: 22px; box-shadow: inset 0 1px 0 var(--hi), var(--shadow-pane);
    -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%); }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 18px; min-height: 52px; }
  .brand svg { flex: none; filter: drop-shadow(0 0 10px rgba(255, 122, 26, .55)); }
  .brand b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
  .brand small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 400; white-space: nowrap; }
  .rooms { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .rooms::-webkit-scrollbar { display: none; }
  .group { margin: 14px 8px 6px; color: var(--ink-3); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .group:first-child { margin-top: 0; }
  .room { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin: 2px 0; border-radius: 14px; color: var(--ink-2); text-decoration: none; font-weight: 550; white-space: nowrap; border: 1px solid transparent; transition: background .18s, color .18s; }
  .room:hover { background: var(--glass-2); color: var(--ink); }
  .room .ico { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--glass); border: 1px solid var(--edge); color: var(--room-t, var(--ember-t)); }
  .room .ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .room .ico.mono { font-size: 12px; font-weight: 750; letter-spacing: .01em; }
  .room[aria-current="true"] { color: var(--ink); background: linear-gradient(90deg, color-mix(in srgb, var(--room) 20%, transparent), rgba(255, 255, 255, .05) 70%); border-color: color-mix(in srgb, var(--room) 38%, transparent); }
  .room[aria-current="true"] .ico { background: color-mix(in srgb, var(--room) 22%, transparent); border-color: color-mix(in srgb, var(--room) 60%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--room) 45%, transparent); }
  .room[aria-current="true"]::before { content: ""; position: absolute; left: -13px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--room); box-shadow: 0 0 12px var(--room); }
  .rail-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--edge); }
  .live { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 0 8px; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px rgba(47, 227, 143, .16), 0 0 12px var(--signal); }
  .fold { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: var(--glass); border: 1px solid var(--edge); cursor: pointer; color: var(--ink-2); }
  .fold:hover { background: var(--glass-2); color: var(--ink); }
  .fold svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .28s var(--ease); }
  .app.slim .fold svg { transform: rotate(180deg); }
  .app.slim :is(.brand div, .room span.label, .group, .live span) { display: none; }
  .app.slim .rail { padding-inline: 10px; }
  .app.slim .room { justify-content: center; padding: 8px 0; }
  .app.slim .room[aria-current="true"]::before { left: -11px; }
  .app.slim .brand { justify-content: center; padding-inline: 0; }
  .app.slim .rail-foot { flex-direction: column; }
  .app.slim .live { justify-content: center; flex: none; padding: 4px 0; }

  /* ---------- workspace ---------- */
  .work { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px 14px 14px 12px; }
  .top { display: flex; align-items: center; gap: 14px; padding: 6px 6px 4px 8px; }
  .where { min-width: 0; }
  .where h1 { margin: 0; font-size: 38px; font-weight: 300; letter-spacing: -.025em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where p:empty { display: none; }
  .where p { margin: 4px 0 0; color: var(--ink-3); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px 0; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 650; color: var(--zone-t); background: color-mix(in srgb, var(--zone) 14%, transparent); border: 1px solid color-mix(in srgb, var(--zone) 36%, transparent); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .theme-toggle { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--edge); color: var(--ink-2); cursor: pointer; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: background .18s, color .18s, border-color .18s; }
  .theme-toggle:hover { background: var(--glass-2); color: var(--ink); border-color: var(--edge-2); }
  .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .moon { display: none; }
  :root[data-theme="light"] .theme-toggle .sun { display: none; }
  :root[data-theme="light"] .theme-toggle .moon { display: block; }
  .account { position: relative; }
  .account > button { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--edge); padding: 4px 12px 4px 4px; border-radius: 999px; font-weight: 600; cursor: pointer; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .account > button:hover { background: var(--glass-2); border-color: var(--edge-2); }
  .avatar { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(140deg, var(--ember-hot), var(--ember)); color: var(--ember-ink); font-size: 13px; font-weight: 800; }
  .caret { width: 10px; height: 10px; opacity: .7; transition: transform .18s var(--ease); }
  .account.open .caret { transform: rotate(180deg); }
  .menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: 240px; padding: 8px; background: var(--pane-menu); border: 1px solid var(--edge-2); border-radius: 16px; box-shadow: var(--shadow-menu); -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%); z-index: 20; }
  .account.open .menu { display: block; }
  .who-email { margin: 4px 8px 8px; color: var(--ink-3); font-size: 12.5px; overflow-wrap: anywhere; }
  .menu a, .menu form button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 550; background: none; border: 0; cursor: pointer; }
  .menu a:hover, .menu form button:hover { background: var(--glass-2); }
  .menu form { margin: 6px 0 0; padding-top: 6px; border-top: 1px solid var(--edge); }

  /* The beam: one light that slides to the page you open. */
  nav { position: relative; display: flex; gap: 2px; margin: 8px 0 12px; padding: 0 4px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--edge); }
  nav::-webkit-scrollbar { display: none; }
  nav.more-right { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); }
  nav.more-left { -webkit-mask-image: linear-gradient(90deg, transparent, #000 56px); mask-image: linear-gradient(90deg, transparent, #000 56px); }
  nav.more-left.more-right { -webkit-mask-image: linear-gradient(90deg, transparent, #000 56px, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, transparent, #000 56px, #000 calc(100% - 56px), transparent); }
  nav a { flex: none; padding: 7px 14px 6px; border-radius: 12px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; font-weight: 550; white-space: nowrap; transition: color .18s, background .18s; }
  nav a:hover { color: var(--ink); background: var(--glass); }
  nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
  .beam { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; border-radius: 3px; background: var(--zone); box-shadow: 0 0 14px 1px var(--zone), 0 0 36px 4px color-mix(in srgb, var(--zone) 55%, transparent); transition: transform .4s var(--ease), width .4s var(--ease), background .3s; pointer-events: none; }
  .beam.snap { transition: none; }

  .stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; border: 1px solid var(--edge);
    background: var(--pane-stage);
    box-shadow: inset 0 1px 0 var(--hi), var(--shadow-stage);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .stage::before { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: linear-gradient(90deg, transparent, var(--zone)); box-shadow: 0 0 12px var(--zone); z-index: 2; opacity: 0; }
  .stage.loading::before { opacity: 1; width: 100%; animation: load 1.1s var(--ease) infinite; }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }

  @media (max-width: 900px) { .app:not(.open-wide) { --rail: 76px; } .app:not(.open-wide) :is(.brand div, .room span.label, .group, .live span) { display: none; } .app:not(.open-wide) .room { justify-content: center; padding: 8px 0; } .fold { display: none; } .app:not(.open-wide) .brand { justify-content: center; padding-inline: 0; } .app:not(.open-wide) .rail-foot { flex-direction: column; } .app:not(.open-wide) .live { justify-content: center; flex: none; } }
  @media (max-width: 600px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .rail { flex-direction: row; align-items: center; margin: 8px 8px 0; padding: 8px 10px; border-radius: 18px; }
    .brand { padding: 0 6px 0 0; min-height: 0; }
    .rooms { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; }
    .room { margin: 0; flex: none; }
    .room[aria-current="true"]::before { left: 10px; right: 10px; top: auto; bottom: -9px; width: auto; height: 3px; }
    .rail-foot { display: none; }
    .where h1 { font-size: 26px; }
    .who-name { display: none; }
    .work { padding: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>

<body>
<div class="ambient" aria-hidden="true"></div>
<div class="app" id="app">
  <aside class="rail" aria-label="Sections">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <defs><linearGradient id="dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
        <path d="M17 2v8" stroke="#aab2c0" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6 22a11 11 0 0 1 22 0z" fill="url(#dome)"/>
        <path d="M11 27.5h12" stroke="#2fe38f" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M13.5 31h7" stroke="#2fe38f" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      </svg>
      <div><b>Supply Chain</b><small>Home Cartel</small></div>
    </div>
    <div class="rooms" id="rooms"></div>
    <div class="rail-foot">
      <div class="live" id="dataSourceBadge" title="Reading and saving to the local database"><i class="dot"></i><span>Local database</span></div>
      <button type="button" class="fold" id="fold" aria-label="Collapse menu" title="Collapse menu"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    </div>
  </aside>

  <div class="work">
    <header class="top">
      <div class="where"><h1 id="secName"></h1><p id="secMeta"></p></div>
      <div class="tools">
        <span data-theme-toggle></span>
        <div class="account" id="account">
          <button type="button" id="accountBtn" aria-haspopup="true" aria-expanded="false" aria-controls="accountMenu">
            <span class="avatar" id="avatar" aria-hidden="true"></span><span class="who-name" id="whoName"></span>
            <svg class="caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <div class="menu" id="accountMenu">
            <p class="who-email" id="whoEmail"></p>
            <p class="who-email" id="whoData" hidden></p>
            <a href="/account">Change password</a>
            <a href="/admin/users" id="usersLink" hidden>Manage users</a>
            <form method="post" action="/logout"><button type="submit">Sign out</button></form>
          </div>
        </div>
      </div>
    </header>
    <nav id="tabs" aria-label="Pages"></nav>
    <main class="stage" id="stage"><iframe id="view" title="Page"></iframe></main>
  </div>
</div>
<script>
  // Each section is a room. Operations glow ember; the partner portals (Tony Fan, Fenteng Lighting) glow signal green.
  var ICON = {
    bars: '<path d="M5 20v-7M12 20V5M19 20v-10"/>',
    box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>',
    crate: '<path d="M3 7h18v13H3zM3 11h18M9 7V4h6v3"/>',
    truck: '<path d="M2 6h11v10.5M13 9.5h4l3 3.5v3.5h-1.7M4.7 16.5H2M8.3 16.5h6.4"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
  };
  var LINES = {
    'analytic':         { group: 'Operations', icon: 'bars',  color: 'var(--ember)', text: 'var(--ember-t)' },
    'procurement':      { group: 'Operations', icon: 'box',   color: 'var(--ember)', text: 'var(--ember-t)' },
    'fulfillment':      { group: 'Operations', icon: 'crate', color: 'var(--ember)', text: 'var(--ember-t)' },
    'delivery':         { group: 'Operations', icon: 'truck', color: 'var(--ember)', text: 'var(--ember-t)' },
    'tony-fan':         { group: 'Partners',   mono: 'TF',    color: 'var(--signal)', text: 'var(--signal-t)' },
    'fenteng-lighting': { group: 'Partners',   mono: 'FL',    color: 'var(--signal)', text: 'var(--signal-t)' },
  };
  var sections = [];
  var $ = function (id) { return document.getElementById(id); };
  var app = $('app');
  var lineOf = function (sec) { return LINES[sec.id] || LINES.analytic; };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function remember(k, v) { try { if (v == null) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  if (remember('hc-rail') === 'slim') app.classList.add('slim');
  $('fold').addEventListener('click', function () {
    var slim = app.classList.toggle('slim');
    remember('hc-rail', slim ? 'slim' : 'wide');
    $('fold').setAttribute('aria-label', slim ? 'Expand menu' : 'Collapse menu');
    $('fold').title = slim ? 'Expand menu' : 'Collapse menu';
    setTimeout(placeBeam, 320);
  });

  // Signed-in user: name in the top bar, account menu with password, users (admins) and sign out.
  fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
    if (!me) { location.href = '/login'; return; }
    var label = me.name || me.email;
    $('whoName').textContent = label;
    $('whoEmail').textContent = me.email;
    $('avatar').textContent = label.trim().charAt(0).toUpperCase();
    $('usersLink').hidden = me.role !== 'admin';
    if (me.dataSource) {
      $('whoData').textContent = 'Data: ' + me.dataSource; $('whoData').hidden = false;
      var badge = $('dataSourceBadge');
      var isPg = me.dataSource === 'Postgres';
      badge.querySelector('span').textContent = isPg ? 'Shared Postgres' : me.dataSource;
      badge.title = isPg ? 'Reading and saving to the shared Postgres database' : 'Reading and saving to the local database';
    }
  });
  var account = $('account'), accountBtn = $('accountBtn');
  function setAccount(open) { account.classList.toggle('open', open); accountBtn.setAttribute('aria-expanded', String(open)); }
  accountBtn.addEventListener('click', function () { setAccount(!account.classList.contains('open')); });
  document.addEventListener('click', function (e) { if (!account.contains(e.target)) setAccount(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setAccount(false); });

  // Same URL shape as Zoho:  #Page:Link_Name?param=value
  function parse(hash) { var m = /#Page:([\w]+)(?:\?(.*))?/.exec(hash || ''); return m ? { page: m[1], query: m[2] || '' } : null; }
  function findTab(page) {
    for (var i = 0; i < sections.length; i++)
      for (var j = 0; j < sections[i].tabs.length; j++)
        if (sections[i].tabs[j].page === page) return { section: sections[i], tab: sections[i].tabs[j] };
    return null;
  }

  var beam = document.createElement('i'); beam.className = 'beam'; beam.setAttribute('aria-hidden', 'true');
  var firstBeam = true;
  function placeBeam() {
    var a = document.querySelector('nav a[aria-current="page"]');
    var n = $('tabs');
    if (!n.contains(beam)) n.appendChild(beam);
    if (!a) { beam.style.width = '0'; return; }
    if (firstBeam) { beam.classList.add('snap'); }
    beam.style.width = a.offsetWidth + 'px';
    beam.style.transform = 'translateX(' + a.offsetLeft + 'px)';
    if (firstBeam) { void beam.offsetWidth; beam.classList.remove('snap'); firstBeam = false; }
  }

  var stage = $('stage'), view = $('view'), lastSection = null;
  view.addEventListener('load', function () { stage.classList.remove('loading'); });

  function route() {
    var r = parse(location.hash);
    var last = sections[sections.length - 1];
    var hit = (r && findTab(r.page)) || { section: last, tab: last.tabs[0] };
    var sec = hit.section, tab = hit.tab, line = lineOf(sec);

    document.documentElement.style.setProperty('--zone', line.color);
    document.documentElement.style.setProperty('--zone-t', line.text);
    $('secName').textContent = sec.label;
    $('secMeta').innerHTML = (line.group === 'Partners' ? '<span class="tag">Partner portal</span>' : '');

    var html = '', g = '';
    // Operations first, then the partner portals; the order inside each group follows the menu.
    var ordered = sections.filter(function (s) { return lineOf(s).group !== 'Partners'; }).concat(sections.filter(function (s) { return lineOf(s).group === 'Partners'; }));
    ordered.forEach(function (s) {
      var l = lineOf(s);
      if (l.group !== g) { g = l.group; html += '<div class="group">' + g + '</div>'; }
      html += '<a class="room" style="--room:' + l.color + ';--room-t:' + l.text + '" href="#Page:' + s.tabs[0].page + '"' + (s === sec ? ' aria-current="true"' : '') + ' title="' + esc(s.label) + '">'
        + '<span class="ico' + (l.mono ? ' mono' : '') + '">' + (l.mono ? l.mono : '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[l.icon] + '</svg>') + '</span>'
        + '<span class="label">' + esc(s.label) + '</span></a>';
    });
    $('rooms').innerHTML = html;

    var shown = sec.tabs.filter(function (t) { return !t.hidden || t === tab; });
    $('tabs').innerHTML = shown.map(function (t) {
      return '<a href="#Page:' + t.page + '"' + (t === tab ? ' aria-current="page"' : '') + '>' + esc(t.label) + '</a>';
    }).join('');
    if (lastSection !== sec.id) firstBeam = true; // a new room: the beam appears in place instead of sliding across other tabs
    lastSection = sec.id;
    document.title = tab.label + ' – ' + sec.label;
    var src = tab.src + (r && r.query ? '?' + r.query : '');
    if (view.getAttribute('src') !== src) { stage.classList.add('loading'); view.src = src; }
    var active = document.querySelector('nav a[aria-current="page"]');
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
    placeBeam();
    edges();
  }
  function edges() {
    var n = $('tabs');
    n.classList.toggle('more-left', n.scrollLeft > 1);
    n.classList.toggle('more-right', n.scrollLeft + n.clientWidth < n.scrollWidth - 1);
  }
  $('tabs').addEventListener('scroll', edges, { passive: true });
  window.addEventListener('resize', function () { edges(); placeBeam(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'zoho-navigate') return;
    var r = parse(e.data.url);
    if (r) location.hash = '#Page:' + r.page + (r.query ? '?' + r.query : '');
    else if (/^https?:/.test(e.data.url)) window.open(e.data.url, '_blank');
  });
  fetch('/api/pages').then(function (r) { return r.json(); }).then(function (list) { sections = list; route(); });
</script>
</body>
</html>
