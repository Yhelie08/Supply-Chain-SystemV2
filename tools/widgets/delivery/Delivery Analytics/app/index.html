<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  REDESIGNED 2026-10-22 against hc-dms-widget (5).html.
  Shared CSS: Widget/DMS/_shared/design/ — change it THERE and re-copy, never here.

  Presentation only. Every metric, fetch and aggregation in the script below is
  untouched, including the 2026-10-06 not-delivered work (Failed / Overdue /
  Unscheduled) and the Exception Queue section. Tailwind is gone, so the
  stale-precompiled-CSS bug cannot affect this widget any more.

  Bar charts are now HORIZONTAL. The categories here are people's names, and
  vertical bars were truncating them to a few characters.
-->
<link rel="stylesheet" href="dms-tokens.css">
<link rel="stylesheet" href="dms-shell.css">
<style>
  .hidden{display:none!important}
  .an-sec{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
  .an-sec-h{margin:0;font-size:var(--fs-sm);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .an-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
  /* Kept as .chart-card because renderBarChart() finds its own title through
     el.closest('.chart-card') — only the styling moved to tokens. */
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 16px;min-width:0}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:0}
  .kpi{cursor:default}
  .kpi:hover{transform:none;border-color:var(--border)}
  .ch-title{font-size:var(--fs-md);font-weight:700}
  .ch-sub{font-size:var(--fs-xs);color:var(--faint);margin-top:2px}
  .ch-empty{padding:26px 0;text-align:center;color:var(--faint);font-size:var(--fs-sm)}
  .stack{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--border)}
  .stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-xs);font-weight:600;overflow:hidden}
  .stack-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
  .stack-legend span{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--muted)}
  .stack-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<main class="main">
  <div class="main-in">

    <div class="top">
      <div>
        <h1 style="margin:0;font-size:var(--fs-2xl);letter-spacing:-.02em">Delivery Analytics</h1>
        <p class="muted" style="margin:3px 0 0;font-size:var(--fs-md)">Read-only dashboard — Service Requests, Installations, Deliveries and Exceptions at a glance.</p>
      </div>
      <div class="top-actions">
        <button class="btn" onclick="location.reload()">Refresh</button>
      </div>
    </div>

    <div id="loadingWrap" class="empty"><strong>Loading analytics…</strong><p class="muted" style="margin:6px 0 0">Reading Service Appointments, Field Work and the Exception Queue.</p></div>

    <!-- Surfaces a hit of fetchAll()'s page guard, so short numbers are never
         shown as if they were the full picture. Kept from 2026-10-06. -->
    <div id="truncWarn" class="notice hidden" style="margin:0 0 14px"></div>

    <div id="dashboardRoot" class="hidden">
    <section class="an-sec">
      <h2 class="an-sec-h">Service Requests</h2>
      <div class="kpis" id="statsServiceRequests"></div>
      <div class="chart-card" data-title="Delivery Status Breakdown (This Month)" data-subtitle="Stacked by current Delivery Status" id="chStatusBreakdown"></div>
      <div class="an-grid">
      <div class="chart-card" data-title="Service Requests Scheduled By Scheduler (This Month)" id="chSchedulerThis"></div>
      <div class="chart-card" data-title="Service Requests Scheduled By Scheduler (Last Month)" id="chSchedulerLast"></div>
      <div class="chart-card" data-title="Appointments by Assignee (This Month)" id="chAssigneeThis"></div>
      <div class="chart-card" data-title="Appointments by Assignee (Last Month)" id="chAssigneeLast"></div>
      </div>
      <div class="kpis" id="statsAppointments"></div>
    </section>
    <section class="an-sec">
      <h2 class="an-sec-h">Installations</h2>
      <div class="kpis" id="statsInstallations"></div>
      <div class="an-grid">
      <div class="chart-card" data-title="Installers Performance (This Month)" data-subtitle="Avg. customer rating, 1–5" id="chInstallersThis"></div>
      <div class="chart-card" data-title="Installers Performance (Last Month)" data-subtitle="Avg. customer rating, 1–5" id="chInstallersLast"></div>
      <div class="chart-card" data-title="Dispatcher Workload" data-subtitle="Total appointments assigned" id="chDispatcherWorkload"></div>
      <div class="chart-card" data-title="Scheduler Performance" data-subtitle="Completion rate, all-time" id="chSchedulerPerf"></div>
      <div class="chart-card" data-title="Dispatcher Performance Comparison (This Month)" data-subtitle="Completion rate %" id="chDispatcherPerfThis"></div>
      <div class="chart-card" data-title="Dispatcher Performance Comparison (Last Month)" data-subtitle="Completion rate %" id="chDispatcherPerfLast"></div>

    </section>
    <section class="an-sec">
      <h2 class="an-sec-h">Deliveries</h2>
      <div class="kpis" id="statsDeliveries"></div>

      <div class="chart-card" data-title="Delivery Outcome (This Month)" data-subtitle="Completed vs Failed vs still outstanding, by confirmed schedule date" id="chOutcome"></div>
      <div class="an-grid">
      <div class="chart-card" data-title="SO Delivered per Driver (This Month)" id="chDriverThis"></div>

      <div class="chart-card" data-title="Failed Deliveries per Driver (Last Month)" id="chFailedDriverLast"></div>
      <div class="chart-card" data-title="Overdue Undelivered by Driver" data-subtitle="Schedule date already past, still not Completed or Failed" id="chOverdueDriver"></div>
      <div class="chart-card" data-title="Reschedule Requested By (This Month)" data-subtitle="Field_Work records logged as Reschedule Requested, by installer on site" id="chRescheduleThis"></div>
      <div class="chart-card" data-title="Reschedule Requested By (Last Month)" data-subtitle="Field_Work records logged as Reschedule Requested, by installer on site" id="chRescheduleLast"></div>
      </div>
    </section>
    <section class="an-sec">
      <h2 class="an-sec-h">Exceptions</h2>
      <div class="kpis" id="statsExceptions"></div>
      <div class="kpis" id="statsExceptionsOpen"></div>
      <div class="chart-card" data-title="Exception Status Breakdown (This Month)" data-subtitle="Stacked by current Status, dated by Date Raised" id="chExcStatus"></div>
      <div class="an-grid">
      <div class="chart-card" data-title="Exceptions by Stage (This Month)" id="chExcStageThis"></div>
      <div class="chart-card" data-title="Exceptions by Stage (Last Month)" id="chExcStageLast"></div>
      <div class="chart-card" data-title="Exceptions by Severity (This Month)" id="chExcSeverity"></div>
      <div class="chart-card" data-title="Exceptions by Reason (This Month)" id="chExcReason"></div>
      <div class="chart-card" data-title="Exceptions Raised By (This Month)" id="chExcRaisedBy"></div>
      <div class="chart-card" data-title="Still-Open Exceptions by Assignee" data-subtitle="Open + In Progress, all time" id="chExcAssignee"></div>
      <div class="chart-card" data-title="Exception Resolution Rate by Assignee" data-subtitle="Resolved or Dismissed as % of assigned, all time" id="chExcResolveRate"></div>
      </div>
    </section>
    </div>

  </div>
</main>

<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script>
/* ==================== CONFIG ====================
   Delivery Analytics — new 2026-07-18, replaces the native Page Builder dashboard
   ("Delivery Management > Delivery Analytics") with a widget, matching this app's
   established "everything is a widget, native forms/dashboards never user-facing"
   convention. Plan's own 1.1 table marks this module "Keep as-is" (no logic
   change) — this widget is a pure read-only UI layer, computes every metric
   client-side from the same 2 reports the native dashboard's own charts read
   from (Service_Appointment, Field_Work_Report), no new fields/workflows.

   Several metrics required a judgment call since the native dashboard's own
   chart configs aren't visible from outside Page Builder (only chart TITLES +
   source report were visible) — each inference is commented at its own
   computation site below. Flagged to user for correction after first live look.
   ==================== */
const REPORT_SA = 'Service_Appointment';
const REPORT_FW = 'Field_Work_Report';
/* ADDED 2026-10-06 - the dashboard had no exception coverage at all (it only
   ever read the 2 reports above). This is the same report the DMS Exception
   Queue widget reads (Widget\DMS\DMSExceptionQueue), field names confirmed
   against it: Exception_ID, Sales_Order_Reference, Exception_Stage, Severity
   (High/Medium/Low), Exception_Reason, Status (Open/In Progress/Resolved/
   Dismissed), Date_Raised, Raised_By, Assigned_To. */
const REPORT_EXC = 'All_DMS_Exception_Queue';

/* ==================== HELPERS (same proven pattern as sibling DMS widgets) ==================== */
function errCode(e){
  try {
    if(e && e.responseText) return JSON.parse(e.responseText).code;
    var s = (e && e.message) ? e.message : (typeof e === 'string' ? e : JSON.stringify(e));
    return JSON.parse(JSON.parse(s).responseText || s).code;
  } catch(_){ return null; }
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* CHANGED 2026-10-06 - was a single page:1/pageSize:200 call, so once a report
   passed 200 rows every counter and chart on this dashboard was silently
   understated with no warning on screen. Now pages through the whole report
   with record_cursor, the same proven pattern as the Purchase Request widget's
   fetchAllItemRecords() (Widget\Proc\Purchase Request): max_records caps a
   single call at 1000 regardless, so the cursor is the only way to get the
   rest. guard<50 bounds it at ~50k rows so a bad cursor cannot spin forever.
   ROW_TRUNCATED records a hit of that guard so renderAll can warn on screen
   instead of quietly showing short numbers again. */
var ROW_TRUNCATED = {};
function fetchAll(reportName){
  var all = [];
  var cursor = null;
  var guard = 0;
  function nextPage(){
    var cfg = { report_name: reportName, max_records: 1000, field_config: 'all' };
    if(cursor) cfg.record_cursor = cursor;
    return ZOHO.CREATOR.DATA.getRecords(cfg).then(function(resp){
      var ok = resp && (resp.code===3000 || String(resp.code)==='3000') && Array.isArray(resp.data);
      if(!ok) return all;
      all = all.concat(resp.data);
      cursor = resp.record_cursor || null;
      guard++;
      if(cursor && guard < 50) return nextPage();
      if(cursor) ROW_TRUNCATED[reportName] = true;
      return all;
    }).catch(function(e){
      var c = errCode(e);
      if(c===9220) return all;
      console.error('[DeliveryAnalytics] fetch error', reportName, e);
      return all;
    });
  }
  return nextPage();
}

/* ==================== DATE HELPERS ==================== */
function parseAnyDate(s){
  if(!s) return null;
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function isToday(d){
  if(!d) return false;
  var n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function isThisMonth(d){
  if(!d) return false;
  var n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
}
function isLastMonth(d){
  if(!d) return false;
  var n = new Date();
  var lm = new Date(n.getFullYear(), n.getMonth()-1, 1);
  return d.getFullYear()===lm.getFullYear() && d.getMonth()===lm.getMonth();
}
/* CHANGED 2026-07-18, 2 live bugs in a row on this one function:
   (1) assumed Zoho Creator always exposes a system "Added_Time" field via the
   REST API — confirmed false via a live field dump of both reports (neither
   Service_Appointment nor Field_Work_Report return it at all). Every
   Today/This Month/Last Month counter/chart silently read undefined and
   failed every date check despite real matching data being present.
   (2) switched to Scheduled_Date_and_Time (confirmed present on both forms)
   — fixed Field_Work (its only real date field, now populated via the
   sample-data seed script) but Service_Appointment's DMS sandbox records all
   have this field genuinely BLANK too, confirmed live via API — it's a
   pre-existing field from before the DMS build that the whole Section B
   scheduling engine never writes to at all (it only ever writes
   Confirmed_Schedule_Date/Suggested_Schedule_Date, the real DMS-native date
   fields). Fixed for real: check the DMS-specific fields FIRST, fall back to
   Scheduled_Date_and_Time last — Field_Work records simply don't have the
   first two field names at all, so they safely fall through to the same
   field this function used before. */
function addedDate(r){ return parseAnyDate(r.Confirmed_Schedule_Date || r.Suggested_Schedule_Date || r.Scheduled_Date_and_Time); }
/* ADDED 2026-10-06 - needed by the overdue/undelivered counters, which compare
   a plain YYYY-MM-DD schedule date against today without timezone drift.
   Same isoDate() the Delivery Queue widget uses for its own today checks. */
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* Exceptions are dated by Date_Raised (the Exception Queue's own raised-on
   field), not by the schedule-date chain addedDate() walks. */
function excDate(r){ return parseAnyDate(r.Date_Raised); }

/* ==================== RENDER PRIMITIVES ==================== */
function statTile(label, value){
  return '<div class="kpi"><div class="lbl">' + esc(label) + '</div>'
       + '<div class="val">' + esc(value) + '</div></div>';
}
function renderStatRow(containerId, tiles){
  document.getElementById(containerId).innerHTML = tiles.map(function(t){ return statTile(t.label, t.value); }).join('');
}

/* Plain-HTML vertical bar chart — single series, teal accent throughout
   (this whole dashboard uses one consistent hue across every chart since
   every chart here is a single metric per category, not a multi-series
   comparison — per dataviz skill: a single series needs no legend, and
   color should follow the entity not be spent distinguishing series that
   don't exist). Bars capped at 24px thick, 4px rounded data-end, value
   labeled at the tip, hairline baseline. */
/* Horizontal bars, using the design's .bar-row / .nm / .bar / .vl.
   The previous version drew vertical bars, which truncated the category labels —
   and here the categories are people's names (installers, drivers, dispatchers),
   so they were the one thing that had to stay readable. Order is unchanged:
   whatever the aggregation helpers return. */
function renderBarChart(elId, data, opts){
  opts = opts || {};
  var el = document.getElementById(elId);
  if(!el) return;
  var card = el.closest('.chart-card');
  var title = card ? card.getAttribute('data-title') : '';
  var subtitle = card ? card.getAttribute('data-subtitle') : '';
  var suffix = opts.suffix || '';
  if(!data || data.length===0){
    el.innerHTML = chartHeader(title, subtitle) + '<div class="ch-empty">No data yet</div>';
    return;
  }
  var max = Math.max.apply(null, data.map(function(d){ return d.value; }));
  if(max<=0) max = 1;
  var rows = data.map(function(d){
    var pct = Math.max((d.value/max)*100, 2);
    return '<div class="bar-row">'
      +  '<div class="nm" title="' + esc(d.label) + '">' + esc(d.label) + '</div>'
      +  '<div class="bar"><b style="width:' + pct + '%"></b></div>'
      +  '<div class="vl"><strong>' + esc(d.value) + suffix + '</strong></div>'
      +  '</div>';
  }).join('');
  el.innerHTML = chartHeader(title, subtitle) + rows;
}
function chartHeader(title, subtitle){
  return '<div style="margin-bottom:10px"><div class="ch-title">' + esc(title) + '</div>'
       + (subtitle ? '<div class="ch-sub">' + esc(subtitle) + '</div>' : '') + '</div>';
}
/* Single stacked bar (100% width, segments by status count) — teal family
   shades since it's still one underlying metric (record count) broken into
   sub-categories, not independent series; each segment direct-labeled since
   there are only a handful of Delivery Status values. */
var STATUS_SHADES = ['#2b59e8','#4f7bf0','#7d9df5','#6d43d6','#9a7ae0','#5b6b86','#8a97a8'];

/* Semantic first, ramp second. Colouring these segments by index is how "Failed"
   ended up green. Covers both vocabularies this chart is used for: Delivery
   Status and Exception Status. */
var STATUS_COLOR = {
  'Completed':'#1c9b55', 'Delivered':'#1c9b55', 'Resolved':'#1c9b55',
  'Failed':'#c22f2f', 'Open':'#c22f2f',
  'Scheduled':'#2b59e8', 'Dispatched':'#2b59e8', 'In Transit':'#4f7bf0', 'In Progress':'#2b59e8',
  'Queued':'#8a97a8', 'Pending':'#8a97a8', 'Unset':'#8a97a8', 'Dismissed':'#5b6b86'
};
function statusShade(label, i){
  return STATUS_COLOR[label] || STATUS_SHADES[i % STATUS_SHADES.length];
}
/* One stacked bar, segments by count. Still a single underlying metric broken
   into sub-categories, so it keeps one hue family rather than spending colour on
   series that do not exist. Segments narrower than 9% drop their inline label and
   rely on the legend. */
function renderStackedStatus(elId, counts){
  var el = document.getElementById(elId);
  if(!el) return;
  var card = el.closest('.chart-card');
  var title = card ? card.getAttribute('data-title') : '';
  var subtitle = card ? card.getAttribute('data-subtitle') : '';
  var entries = Object.keys(counts).map(function(k){ return { label:k, value:counts[k] }; })
                      .filter(function(e){ return e.value>0; });
  var total = entries.reduce(function(sum,e){ return sum+e.value; }, 0);
  if(total===0){
    el.innerHTML = chartHeader(title, subtitle) + '<div class="ch-empty">No data yet</div>';
    return;
  }
  var segs = entries.map(function(e, i){
    var pct = (e.value/total)*100;
    var shade = statusShade(e.label, i);
    return '<div style="width:' + pct + '%;background:' + shade + '" title="'
      + esc(e.label) + ': ' + e.value + '">' + (pct>9 ? esc(e.label) : '') + '</div>';
  }).join('');
  var legend = entries.map(function(e, i){
    var shade = statusShade(e.label, i);
    return '<span><i style="background:' + shade + '"></i>' + esc(e.label) + ' (' + e.value + ')</span>';
  }).join('');
  el.innerHTML = chartHeader(title, subtitle)
    + '<div class="stack">' + segs + '</div>'
    + '<div class="stack-legend">' + legend + '</div>';
}

/* ==================== AGGREGATION ==================== */
function groupCount(rows, field, filterFn){
  var out = {};
  rows.forEach(function(r){
    if(filterFn && !filterFn(r)) return;
    var key = r[field];
    if(!key) return;
    out[key] = (out[key]||0) + 1;
  });
  return Object.keys(out).map(function(k){ return { label:k, value:out[k] }; }).sort(function(a,b){ return b.value-a.value; });
}
function groupRate(rows, field, completeFn){
  var totals = {}, done = {};
  rows.forEach(function(r){
    var key = r[field];
    if(!key) return;
    totals[key] = (totals[key]||0) + 1;
    if(completeFn(r)) done[key] = (done[key]||0) + 1;
  });
  return Object.keys(totals).map(function(k){
    var rate = totals[k]>0 ? Math.round(((done[k]||0)/totals[k])*100) : 0;
    return { label:k, value:rate };
  }).sort(function(a,b){ return b.value-a.value; });
}
function groupAvgRating(rows, field){
  var ratingMap = {'⭐':1,'⭐⭐':2,'⭐⭐⭐':3,'⭐⭐⭐⭐':4,'⭐⭐⭐⭐⭐':5};
  var sums = {}, counts = {};
  rows.forEach(function(r){
    var key = r[field];
    var rating = ratingMap[r.Customer_Rating];
    if(!key || !rating) return;
    sums[key] = (sums[key]||0) + rating;
    counts[key] = (counts[key]||0) + 1;
  });
  return Object.keys(sums).map(function(k){ return { label:k, value: Math.round((sums[k]/counts[k])*10)/10 }; }).sort(function(a,b){ return b.value-a.value; });
}

/* ==================== LOAD ==================== */
window.addEventListener('load', function(){
  if(typeof ZOHO==='undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.DATA){
    document.getElementById('loadingWrap').textContent = 'Widget SDK not available — see console';
    console.error('[DeliveryAnalytics] SDK not available');
    return;
  }
  Promise.all([fetchAll(REPORT_SA), fetchAll(REPORT_FW), fetchAll(REPORT_EXC)]).then(function(results){
    renderAll(results[0], results[1], results[2]);
    document.getElementById('loadingWrap').classList.add('hidden');
    document.getElementById('dashboardRoot').classList.remove('hidden');
  });
});

function renderAll(sa, fw, exc){
  exc = exc || [];
  var COMPLETED_STATUSES = ['Completed'];
  var isCompleted = function(r){ return COMPLETED_STATUSES.indexOf(r.Appointment_Status)>=0; };
  var isAssigned = function(r){ return !!r.Installer; };
  var isPendingAssigned = function(r){ return isAssigned(r) && !isCompleted(r) && r.Appointment_Status!=='Failed'; };

  /* ADDED 2026-10-06 - not-delivered predicates. 'Failed' is the terminal
     not-delivered status (confirmed against the Delivery Queue widget, whose
     own read-only/terminal checks treat Completed and Failed as the only two
     end states). 'Outstanding' is everything still in flight: neither
     Completed nor Failed. Overdue splits that by whether the confirmed
     schedule date has already passed, which is the number that actually means
     "di nadeliver" rather than "not yet due". */
  var isFailed = function(r){ return r.Appointment_Status==='Failed'; };
  var isOutstanding = function(r){ return !isCompleted(r) && !isFailed(r); };
  var TODAY_ISO = isoDate(new Date());
  var schedISO = function(r){
    var v = r.Confirmed_Schedule_Date || r.Suggested_Schedule_Date || '';
    return String(v).slice(0,10);
  };
  var isOverdue = function(r){
    var d = schedISO(r);
    return isOutstanding(r) && !!d && d < TODAY_ISO;
  };
  var isUnscheduled = function(r){ return isOutstanding(r) && !schedISO(r); };
  /* Exception_Status lives on Service_Appointment itself (set by the exception
     flow, read the same way by the Delivery Queue's exceptionBadge()), which is
     a different thing from the Exception Queue records counted further down -
     this one says "this appointment is currently flagged". */
  var isFlagged = function(r){ return r.Exception_Status==='Flagged'; };

  /* Truncation warning - see fetchAll()'s ROW_TRUNCATED note. */
  var truncated = Object.keys(ROW_TRUNCATED);
  if(truncated.length){
    var tw = document.getElementById('truncWarn');
    tw.textContent = 'Heads up: ' + truncated.join(', ') + ' returned more rows than this dashboard paged through, so the numbers below are understated. Tell IT.';
    tw.classList.remove('hidden');
  }

  /* ---- Service Requests counters ---- */
  renderStatRow('statsServiceRequests', [
    { label:'Service Requests Added (Today)', value: sa.filter(function(r){ return isToday(addedDate(r)); }).length },
    { label:'Service Requests Added (This Month)', value: sa.filter(function(r){ return isThisMonth(addedDate(r)); }).length },
    { label:'Service Requests Added (Last Month)', value: sa.filter(function(r){ return isLastMonth(addedDate(r)); }).length }
  ]);
  renderStatRow('statsAppointments', [
    { label:'Pending Appointments (Assigned)', value: sa.filter(isPendingAssigned).length },
    { label:'Complete Appointments (Assigned)', value: sa.filter(function(r){ return isAssigned(r) && isCompleted(r); }).length }
  ]);

  /* Scheduled_by = the real "Scheduler" field on Service_Appointment_Form */
  renderBarChart('chSchedulerThis', groupCount(sa.filter(function(r){ return isThisMonth(addedDate(r)); }), 'Scheduled_by'));
  renderBarChart('chSchedulerLast', groupCount(sa.filter(function(r){ return isLastMonth(addedDate(r)); }), 'Scheduled_by'));
  /* "Assignee" = Installer (the primary person an appointment is assigned to) */
  renderBarChart('chAssigneeThis', groupCount(sa.filter(function(r){ return isThisMonth(addedDate(r)); }), 'Installer'));
  renderBarChart('chAssigneeLast', groupCount(sa.filter(function(r){ return isLastMonth(addedDate(r)); }), 'Installer'));

  var statusCounts = {};
  sa.filter(function(r){ return isThisMonth(addedDate(r)); }).forEach(function(r){
    var k = r.Appointment_Status || 'Unset';
    statusCounts[k] = (statusCounts[k]||0) + 1;
  });
  renderStackedStatus('chStatusBreakdown', statusCounts);

  /* ---- Installations counters (Field_Work, Installation_Status) ---- */
  var isInstallComplete = function(r){ return r.Installation_Status==='Complete'; };
  renderStatRow('statsInstallations', [
    { label:'Completed Installations (Today)', value: fw.filter(function(r){ return isInstallComplete(r) && isToday(addedDate(r)); }).length },
    { label:'Completed Installations (This Month)', value: fw.filter(function(r){ return isInstallComplete(r) && isThisMonth(addedDate(r)); }).length },
    { label:'Completed Installations (Last Month)', value: fw.filter(function(r){ return isInstallComplete(r) && isLastMonth(addedDate(r)); }).length }
  ]);

  /* Installers Performance = avg Customer_Rating per installer (quality, not
     volume — "Appointments by Assignee" already covers volume, see design
     notes) */
  renderBarChart('chInstallersThis', groupAvgRating(fw.filter(function(r){ return isThisMonth(addedDate(r)); }), 'Assigned_to_Installer'), { suffix:'★' });
  renderBarChart('chInstallersLast', groupAvgRating(fw.filter(function(r){ return isLastMonth(addedDate(r)); }), 'Assigned_to_Installer'), { suffix:'★' });

  /* Dispatcher Workload = raw volume, all current data, from Service_Appointment's
     own Assigned_to_Dispatcher field */
  renderBarChart('chDispatcherWorkload', groupCount(sa, 'Assigned_to_Dispatcher'));
  /* Scheduler/Dispatcher Performance = completion RATE %, distinguishing this
     from the raw-count "Workload"/"Scheduled By" charts above */
  renderBarChart('chSchedulerPerf', groupRate(sa, 'Scheduled_by', isCompleted), { suffix:'%' });
  renderBarChart('chDispatcherPerfThis', groupRate(sa.filter(function(r){ return isThisMonth(addedDate(r)); }), 'Assigned_to_Dispatcher', isCompleted), { suffix:'%' });
  renderBarChart('chDispatcherPerfLast', groupRate(sa.filter(function(r){ return isLastMonth(addedDate(r)); }), 'Assigned_to_Dispatcher', isCompleted), { suffix:'%' });

  /* ---- Deliveries counters ---- */
  renderStatRow('statsDeliveries', [
    { label:'Completed Deliveries (Today)', value: sa.filter(function(r){ return isCompleted(r) && isToday(addedDate(r)); }).length },
    { label:'Completed Deliveries (This Month)', value: sa.filter(function(r){ return isCompleted(r) && isThisMonth(addedDate(r)); }).length },
    { label:'Completed Deliveries (Last Month)', value: sa.filter(function(r){ return isCompleted(r) && isLastMonth(addedDate(r)); }).length }
  ]);

  /* ---- Not-delivered counters (ADDED 2026-10-06) ----
     Same addedDate() schedule-date basis as the Completed tiles above, so the
     two rows reconcile against each other for the same period. */
  renderStatRow('statsFailed', [
    { label:'Failed Deliveries (Today)', value: sa.filter(function(r){ return isFailed(r) && isToday(addedDate(r)); }).length },
    { label:'Failed Deliveries (This Month)', value: sa.filter(function(r){ return isFailed(r) && isThisMonth(addedDate(r)); }).length },
    { label:'Failed Deliveries (Last Month)', value: sa.filter(function(r){ return isFailed(r) && isLastMonth(addedDate(r)); }).length }
  ]);
  /* Current-state row - deliberately NOT period-filtered: an overdue delivery
     from two months ago is still undelivered today and still needs chasing. */
  renderStatRow('statsUndelivered', [
    { label:'Undelivered - Overdue', value: sa.filter(isOverdue).length },
    { label:'Undelivered - Not Yet Due', value: sa.filter(function(r){ return isOutstanding(r) && !!schedISO(r) && schedISO(r) >= TODAY_ISO; }).length },
    { label:'Undelivered - No Schedule Date', value: sa.filter(isUnscheduled).length },
    { label:'Outstanding (All Undelivered)', value: sa.filter(isOutstanding).length },
    { label:'Appointments Flagged as Exception', value: sa.filter(isFlagged).length }
  ]);

  /* Outcome split for the month - the one place Completed, Failed and
     still-outstanding are shown against each other. */
  var outcomeThis = sa.filter(function(r){ return isThisMonth(addedDate(r)); });
  renderStackedStatus('chOutcome', {
    'Completed': outcomeThis.filter(isCompleted).length,
    'Failed': outcomeThis.filter(isFailed).length,
    'Still Outstanding': outcomeThis.filter(isOutstanding).length
  });

  renderBarChart('chDriverThis', groupCount(sa.filter(function(r){ return isCompleted(r) && isThisMonth(addedDate(r)); }), 'Assigned_to_Driver'));
  renderBarChart('chDriverLast', groupCount(sa.filter(function(r){ return isCompleted(r) && isLastMonth(addedDate(r)); }), 'Assigned_to_Driver'));
  renderBarChart('chFailedDriverThis', groupCount(sa.filter(function(r){ return isFailed(r) && isThisMonth(addedDate(r)); }), 'Assigned_to_Driver'));
  renderBarChart('chFailedDriverLast', groupCount(sa.filter(function(r){ return isFailed(r) && isLastMonth(addedDate(r)); }), 'Assigned_to_Driver'));
  renderBarChart('chOverdueDriver', groupCount(sa.filter(isOverdue), 'Assigned_to_Driver'));

  /* Reschedule Requested By = Field_Work records logged Status=="Reschedule
     Requested", grouped by Assigned_to_Installer (the on-site field team —
     see design notes for why installer over dispatcher) */
  var isRescheduleReq = function(r){ return r.Status==='Reschedule Requested'; };
  renderBarChart('chRescheduleThis', groupCount(fw.filter(function(r){ return isThisMonth(addedDate(r)); }), 'Assigned_to_Installer', isRescheduleReq));
  renderBarChart('chRescheduleLast', groupCount(fw.filter(function(r){ return isLastMonth(addedDate(r)); }), 'Assigned_to_Installer', isRescheduleReq));

  /* ---- Exceptions (ADDED 2026-10-06, All_DMS_Exception_Queue) ----
     Status defaults to 'Open' when blank, matching how the Exception Queue
     widget itself reads the field (r.Status || 'Open'). */
  var excStatus = function(r){ return r.Status || 'Open'; };
  var isExcOpen = function(r){ var s = excStatus(r); return s==='Open' || s==='In Progress'; };
  var isExcClosed = function(r){ var s = excStatus(r); return s==='Resolved' || s==='Dismissed'; };
  var excThis = exc.filter(function(r){ return isThisMonth(excDate(r)); });
  var excLast = exc.filter(function(r){ return isLastMonth(excDate(r)); });

  renderStatRow('statsExceptions', [
    { label:'Exceptions Raised (Today)', value: exc.filter(function(r){ return isToday(excDate(r)); }).length },
    { label:'Exceptions Raised (This Month)', value: excThis.length },
    { label:'Exceptions Raised (Last Month)', value: excLast.length },
    { label:'Exceptions Raised (All Time)', value: exc.length }
  ]);
  /* Current-state row again, not period-filtered - an exception opened last
     month that is still Open is still open. */
  renderStatRow('statsExceptionsOpen', [
    { label:'Still Open', value: exc.filter(function(r){ return excStatus(r)==='Open'; }).length },
    { label:'In Progress', value: exc.filter(function(r){ return excStatus(r)==='In Progress'; }).length },
    { label:'High Severity Still Open', value: exc.filter(function(r){ return isExcOpen(r) && r.Severity==='High'; }).length },
    { label:'Resolved (This Month)', value: excThis.filter(function(r){ return excStatus(r)==='Resolved'; }).length },
    { label:'Dismissed (This Month)', value: excThis.filter(function(r){ return excStatus(r)==='Dismissed'; }).length }
  ]);

  var excStatusCounts = {};
  excThis.forEach(function(r){
    var k = excStatus(r);
    excStatusCounts[k] = (excStatusCounts[k]||0) + 1;
  });
  renderStackedStatus('chExcStatus', excStatusCounts);

  renderBarChart('chExcStageThis', groupCount(excThis, 'Exception_Stage'));
  renderBarChart('chExcStageLast', groupCount(excLast, 'Exception_Stage'));
  renderBarChart('chExcSeverity', groupCount(excThis, 'Severity'));
  renderBarChart('chExcReason', groupCount(excThis, 'Exception_Reason'));
  renderBarChart('chExcRaisedBy', groupCount(excThis, 'Raised_By'));
  renderBarChart('chExcAssignee', groupCount(exc.filter(isExcOpen), 'Assigned_To'));
  renderBarChart('chExcResolveRate', groupRate(exc, 'Assigned_To', isExcClosed), { suffix:'%' });
}
</script>
</body>
</html>
