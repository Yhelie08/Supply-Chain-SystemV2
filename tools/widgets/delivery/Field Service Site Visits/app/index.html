<style>
  /* Written here rather than in the shared sheet: these map THIS widget's own
     long-standing class names onto the design, so no JS had to change. */
  .dms-page{display:flex;flex-direction:column;gap:18px}
  .dms-h1{margin:0;font-size:var(--fs-2xl);letter-spacing:-.02em}
  .dms-sub{margin:3px 0 0;font-size:var(--fs-md);color:var(--muted)}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:0}
  .kpi{cursor:default}
  .kpi:hover{transform:none;border-color:var(--border)}
  /* setFilter() toggles .active on .pill, so .pill mirrors the design's .fchip
     instead of renaming anything. */
  .pill{border:1px solid var(--border);background:var(--surface);border-radius:20px;
        padding:5px 12px;font-size:var(--fs-sm);cursor:pointer;color:var(--muted);
        display:inline-flex;gap:6px;align-items:center;min-height:32px;font-weight:500;
        white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
  .pill:hover{border-color:var(--border-strong)}
  .pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .pill:active{transform:scale(.98)}
  .dms-search{position:relative;width:100%;max-width:260px}
  .dms-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
        width:14px;height:14px;color:var(--faint);pointer-events:none}
  .dms-search-input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid var(--border);
        border-radius:20px;background:var(--surface);color:var(--text);font-size:var(--fs-sm);outline:none}
  .dms-search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .panel-head{justify-content:space-between}
  /* These two lived in tailwind-input.css, not in the widget's own <style>, so
     dropping Tailwind dropped them and every modal rendered open on load.
     Restored here as plain CSS. */
  .modal-overlay{display:none}
  .modal-overlay.show{display:flex}
  /* The original header was sm:justify-between; .top is a plain flex row, so
     push a lone action button to the far right the way .top-actions does. */
  .top > button{margin-left:auto}
  .hidden{display:none!important}
</style>

<style>
  html,body{font-family:'Inter',system-ui,sans-serif}
  .hidden{display:none!important}
  /* Photo thumb + lightbox — ported from the proven pattern in
     UI/EndUser/Receiving/app/index.html (itself ported from UI/EndUser/INQs), for

  .photo-thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid #E2E8F0;cursor:zoom-in;transition:transform 150ms ease}

  .photo-thumb-wrap{position:relative;display:inline-block;margin-top:6px}
  .photo-thumb-del{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:none;background:#dc2626;color:#fff;font-size:11px;line-height:16px;padding:0;cursor:pointer}
  .lightbox-overlay{display:none;position:fixed;inset:0;z-index:6000;align-items:center;justify-content:center;padding:40px;background:rgba(0,0,0,.82)}
  .lightbox-overlay.open{display:flex}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 15px -3px rgba(0,0,0,.3);cursor:default}

  .lightbox-close:hover,.lightbox-nav:hover{background:rgba(255,255,255,.3)}
  .lightbox-close{top:20px;right:24px}
  .lightbox-nav{top:50%;transform:translateY(-50%);font-size:22px}
  .lightbox-nav.prev{left:24px}
  .lightbox-nav.next{right:24px}
  .lightbox-counter{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;opacity:.85}
  /* Confirm modal — small Yes/No dialog, plain CSS (not Tailwind arbitrary z-[90],
     which never got generated by the precompiled build since it's only constructed
     at runtime — same reasoning as the delete-badge fix, avoid Tailwind for anything
     dynamically inserted). z-index above both the detail modal (z-50) and the
     lightbox (6000) so it's never accidentally hidden behind either. */
  .confirm-overlay{display:none;position:fixed;inset:0;z-index:7000;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.5)}
  .confirm-overlay.open{display:flex}
  .confirm-box{background:#fff;border-radius:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,.3);width:100%;max-width:320px;padding:18px}
  .confirm-title{font-size:14.5px;font-weight:700;color:#0f172a;margin-bottom:6px}
  .confirm-msg{font-size:12px;color:#64748B;line-height:1.5;margin-bottom:16px}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px}
  .confirm-btn{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none}
  .confirm-btn-cancel{background:#fff;border:1px solid #E2E8F0;color:#475569}
  .confirm-btn-cancel:hover{background:#F8FAFC}
  .confirm-btn-ok{background:#dc2626;color:#fff}
  .confirm-btn-ok:hover{background:#b91c1c}

  /* Detail modal — explicit styles ensuring modal never overflows viewport or blows full-screen */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5000;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show {
    display: flex !important;
  }
  .modal-dialog {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 840px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border: 1px solid #e2e8f0;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #e2e8f0;
    background: #ffffff;
    flex-shrink: 0;
    z-index: 20;
  }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    font-size: 13px;
  }
  .modal-sticky-footer {
    position: sticky;
    bottom: -20px;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
    padding: 12px 20px;
    margin: 16px -20px -20px -20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
  }
  .fsv-grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  /* Signature pads (Edit mode) - plain CSS, not Tailwind, so no CSS rebuild is needed. */
  .sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
  .sig-pad-wrap{border:1px dashed #cbd5e1;border-radius:10px;background:#fff;overflow:hidden}
  .sig-pad{display:block;width:100%;height:140px;touch-action:none;cursor:crosshair}
  .sig-pad-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:#94a3b8}
  .sig-clear{font-size:11.5px;font-weight:600;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:3px 10px;cursor:pointer}
  .sig-clear:hover{background:#f8fafc}
  .fsv-grid-3 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
</style>

<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
<script>

const REPORT_NAME = 'Field_Service_Site_Visit_Form_Report';

];

var FSV_TECH_LIST = ['Norman', 'Edmon', 'Russel', 'CJ', 'Jonrey', 'JD', 'Nherwin', 'Others'];
var FSV_DRIVER_LIST = ['Zaldy', 'Rash', 'Marlon'];
var FSV_PURPOSE_LIST = ['Installation Assessment', 'Repair Assessment', 'Other'];
var IS_EDIT_MODE = false;

var ALL_ROWS = [];
var CURRENT_FILTER = 'all';

window.addEventListener('load', loadList);

function errCode(e){
  try {
    if(e && e.code !== undefined) return e.code;
    if(e && e.responseText) return JSON.parse(e.responseText).code;
    var s = (e && e.message) ? e.message : (typeof e === 'string' ? e : JSON.stringify(e));
    return JSON.parse(JSON.parse(s).responseText || s).code;
  } catch(_){
    try {
      if(e && typeof e === 'object' && e.code !== undefined) return e.code;
    } catch(__){}
    return null;
  }
}

function describeErrorItems(items){
  if(!Array.isArray(items)) return String(items);
  return items.map(function(item){
    if(typeof item === 'string') return item;
    if(item && item.message) return item.message;
    if(item && item.error) return (item.field ? (item.field + ': ') : '') + item.error;
    try { return JSON.stringify(item); } catch(_){ return String(item); }
  }).join('; ');
}

function describeSaveError(resp){
  if(!resp) return 'unknown error (empty response)';
  if(typeof resp === 'string') return resp;
  if(resp.responseText){
    try {
      var parsed = JSON.parse(resp.responseText);
      var inner = describeSaveError(parsed);
      if(inner && inner !== 'unknown error') return inner;
    } catch(_){}
  }
  if(resp.message) return String(resp.message);
  if(resp.error){
    if(Array.isArray(resp.error)) return describeErrorItems(resp.error);
    if(typeof resp.error === 'string') return resp.error;
    try { return JSON.stringify(resp.error); } catch(_){}
  }
  if(resp.description) return String(resp.description);
  if(resp.data){
    if(resp.data.message) return String(resp.data.message);
    if(resp.data.error) return Array.isArray(resp.data.error) ? describeErrorItems(resp.data.error) : String(resp.data.error);
  }
  try { return JSON.stringify(resp); } catch(_){ return 'see console'; }
}

function toInputDate(val){
  if(!val) return '';
  var s = String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  var months = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06', jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
  var m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(m){
    var day = (m[1].length === 1 ? '0' : '') + m[1];
    var mon = months[m[2].toLowerCase()] || '01';
    var yr = m[3];
    return yr + '-' + mon + '-' + day;
  }
  var d = new Date(s);
  if(!isNaN(d.getTime())){
    var y = d.getFullYear();
    var mo = ('0' + (d.getMonth() + 1)).slice(-2);
    var da = ('0' + d.getDate()).slice(-2);
    return y + '-' + mo + '-' + da;
  }
  return s;
}

function getAllSectionOptions(sec, currentVals){
  var set = (sec.options || []).slice();
  if(Array.isArray(currentVals)){
    currentVals.forEach(function(v){
      if(v && set.indexOf(v) === -1) set.push(v);
    });
  } else if(currentVals && typeof currentVals === 'string' && set.indexOf(currentVals) === -1){
    set.push(currentVals);
  }
  return set;
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function custName(r){
  if(!r) return '';
  if(r.Name && typeof r.Name === 'object'){
    var f = r.Name.first_name || '';
    var l = r.Name.last_name || '';
    return (f + ' ' + l).trim();
  }
  return r.Name || r.Client_Rep_Name || r.Client_Name || r.Customer_Name || '';
}
function isSiteReady(r){
  var v = r.Final_Check_Sign_off;
  var arr = Array.isArray(v) ? v : (v ? [v] : []);
  return arr.indexOf('Site is ready for installation') >= 0;
}
function readyBadge(r){
  var ready = isSiteReady(r);
  var cls = ready ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
  return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold ' + cls + '">' + (ready ? 'Ready' : 'Pending') + '</span>';
}
var TOAST_TIMER = null;
function showToast(msg, duration){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translate(-50%,0)';
  // Error toasts pass a longer duration so the Zoho error detail can be read.
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ t.style.opacity = '0'; t.style.transform = 'translate(-50%,8px)'; }, duration || 3200);
}

function loadList(){
  document.getElementById('listBody').innerHTML = '<tr><td colspan="7" class="p-16 text-center text-slate-400 text-[13px]">Loading…</td></tr>';
  if(typeof ZOHO==='undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.DATA){
    console.error('[FieldServiceSiteVisits] SDK not available');
    showToast('Widget SDK not available — see console');
    return;
  }
  ZOHO.CREATOR.DATA.getRecords({ report_name: REPORT_NAME, page: 1, pageSize: 200, field_config: 'all' })
    .then(function(resp){
      ALL_ROWS = (resp && resp.code===3000 && resp.data) ? resp.data : [];
      renderStats();
      renderList();
    })
    .catch(function(e){
      var c = errCode(e);
      if(c===9220){ ALL_ROWS = []; renderStats(); renderList(); return; }
      console.error('[FieldServiceSiteVisits] getRecords error', e);
      document.getElementById('listBody').innerHTML = '<tr><td colspan="7" class="p-16 text-center text-slate-400">Could not load — see console</td></tr>';
    });
}

function renderStats(){
  var ready = ALL_ROWS.filter(isSiteReady).length;
  var byPurpose = {};
  ALL_ROWS.forEach(function(r){ var k = r.Purpose_of_Visit || 'Unset'; byPurpose[k] = (byPurpose[k]||0)+1; });
  var cards = [
    { label:'Total Visits', value: ALL_ROWS.length },
    { label:'Site Ready', value: ready },
    { label:'Installation', value: byPurpose['Installation Assessment']||0 },
    { label:'Repair', value: byPurpose['Repair Assessment']||0 }
  ];
  document.getElementById('statCards').innerHTML = cards.map(function(c){
    return '<div class="bg-white border border-slate-200 rounded-xl shadow-sm px-4 py-3.5">' +
      '<div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">' + esc(c.label) + '</div>' +
      '<div class="text-2xl font-bold text-slate-900 mt-1">' + esc(c.value) + '</div></div>';
  }).join('');
}

function setFilter(f){
  CURRENT_FILTER = f;
  document.querySelectorAll('#filterPills .pill').forEach(function(p){
    p.classList.toggle('active', p.getAttribute('data-filter')===f);
  });
  renderList();

function renderList(){

/* Photo rendering — confirmed 2026-07-22: a bare relative download URL
   (e.g. "/api/v2.1/homecartel/supply-chain-app/report/.../Photo/download?filepath=...")
   cannot go directly into a plain `<img src>` — the widget's iframe is served from a
   different origin (zappsusercontent.com), so a relative path resolves against the
   wrong domain and silently 404s. ZOHO.CREATOR.UTIL.setImageData(imgEl, url, cb)
   resolves it correctly (same proven pattern as Receiving/Exception's own
   Evidence_Photos rendering). Needs a live DOM element, so callers render an empty
   placeholder <img id> first, then call this in a second pass. */
/* Some of this form's photo fields (Layout_Photo/Surface_Condition_Photo/
   Ceiling_Photo_if_possible) are native multi-file image fields (file count=10)
   — getRecords can return these as an ARRAY of URL strings, not a plain string.
   setImageData's own internal parsing calls .startsWith() on whatever's passed,
   which throws on a non-string (confirmed live 2026-07-29, "m.startsWith is not
   a function" — took down the whole list render since it threw synchronously
   inside the getRecords .then() chain, misreported as a "getRecords error").
   Normalize to a single usable string first — first non-blank array entry, or
   the value as-is if already a string. */
function firstImageUrl(rawValue){
  if(Array.isArray(rawValue)){
    for(var i=0;i<rawValue.length;i++){ if(rawValue[i]) return rawValue[i]; }
    return null;
  }
  return rawValue;
}
function applyCreatorImage(imgEl, rawValue){
  if(!imgEl) return;
  var url = firstImageUrl(rawValue);
  if(url==null || url==='') return;
  if(typeof ZOHO!=='undefined' && ZOHO.CREATOR && ZOHO.CREATOR.UTIL && ZOHO.CREATOR.UTIL.setImageData){
    ZOHO.CREATOR.UTIL.setImageData(imgEl, url, function(){});
  } else {
    imgEl.src = url;
  }
}

/* ════════════════════════════════
   PHOTOS — multiple photos per checklist section, added 2026-07-22 per user request.
   Real scope change from this widget's original pure-read-only design (per plan's
   "Keep as-is"), explicitly requested — the native form's own Layout_Photo/
   Surface_Condition_Photo/Ceiling_Photo_if_possible fields are single-file only
   (confirmed via 2 live experiments 2026-07-22: sequential uploads REPLACE rather
   than append, and the REST endpoint flatly rejects >1 file in one request —
   "file... used twice" — even though the field is configured file count=10), so
   "multiple photos" can't live there via any code path. Uses a NEW dedicated form,
   `Site_Visit_Photos`, same one-record-per-photo shape already proven for Receiving/
   Exception's own `Evidence_Photos` — but its own form, not shared, per user's
   explicit choice ("im gonna create new form"). `Section` field link name is
   `Section` field link name is `Section1` on the live form — "Section" collided with
   a reserved AppIDE keyword, got auto-renamed.
════════════════════════════════ */
var PHOTO_FORM = 'Site_Visit_Photos';
var PHOTO_REPORT = 'All_Site_Visit_Photos'; // educated guess (this app's own All_X convention) — confirm live, fix if getRecords errors report-not-found
var CURRENT_DETAIL_ID = null;
var SECTION_PHOTOS = {}; // secIdx -> array of Site_Visit_Photos rows
var LIGHTBOX_ROWS = [];
var LIGHTBOX_IDX = 0;

function nowDateTimeStr(){
  var d = new Date();
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

function loadSectionPhotos(id){
  if(typeof ZOHO==='undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.DATA) return Promise.resolve();
  var criteria = 'Record_ID=="' + String(id).replace(/"/g,'\\"') + '"';
  return ZOHO.CREATOR.DATA.getRecords({ report_name: PHOTO_REPORT, criteria: criteria, max_records: 200 })
    .then(function(resp){
      var rows = (resp && resp.code===3000 && Array.isArray(resp.data)) ? resp.data : [];
      SECTION_PHOTOS = {};
      CHECKLIST_SECTIONS.forEach(function(sec, secIdx){
        if(!sec.photo) return;
        SECTION_PHOTOS[secIdx] = rows.filter(function(row){ return row.Section1 === sec.photo; });
      });
    })
    .catch(function(err){
      var c = errCode(err);
      if(c !== 9220) console.warn('[FieldServiceSiteVisits] loadSectionPhotos error', err);
      SECTION_PHOTOS = {};
    });
}

function renderSectionPhotoStrip(secIdx){
  var el = document.getElementById('photoStrip' + secIdx);
  if(!el) return;
  var rows = SECTION_PHOTOS[secIdx] || [];
  if(rows.length===0){
    el.innerHTML = '<span class="text-slate-400 text-[11.5px]">No photos yet</span>';
    return;
  }
  el.innerHTML = rows.map(function(row, i){
    return '<span class="photo-thumb-wrap">' +
      '<img id="thumb' + secIdx + '_' + i + '" class="photo-thumb" onclick="openLightbox(' + secIdx + ',' + i + ')" onerror="this.style.display=\'none\'" />' +
      '<button type="button" class="photo-thumb-del" onclick="event.stopPropagation();deletePhoto(' + secIdx + ',' + i + ')" title="Remove photo">&#215;</button>' +
    '</span>';
  }).join('');
  rows.forEach(function(row, i){
    var imgEl = document.getElementById('thumb' + secIdx + '_' + i);
    applyCreatorImage(imgEl, row.Photo);
  });
}

/* ════════════════════════════════
   DELETE PHOTO — added 2026-07-22 per user request ("x button confirmation yes->
   delete completely even in native"). Removes the Site_Visit_Photos record outright
   (real ZOHO.CREATOR.DATA.deleteRecordById, not a soft-remove) and best-effort clears
   the matching native single-file field too — same "clearing is a plain
   updateRecordById write of ''" pattern already proven elsewhere in this app (e.g.
   INQs' Similar Design Photo remove). Since the native field only ever mirrors
   whichever photo was uploaded MOST RECENTLY for that section (it can't hold more
   than one — see the PHOTOS block's own NOTES), clearing it unconditionally on ANY
   delete in that section is the honest behavior: there's no stored reference tying a
   specific Site_Visit_Photos row to "is this the one currently mirrored natively",
   so blanking native is safer than risking it silently keep showing a photo that may
   no longer be accurate.
════════════════════════════════ */
function deletePhoto(secIdx, photoIdx){
  var row = (SECTION_PHOTOS[secIdx] || [])[photoIdx];
  if(!row) return;
  showConfirmModal(
    'Remove this photo?',
    'This deletes it completely — from the photo list and from the native form field. This cannot be undone.',
    function(){ doDeletePhoto(secIdx, photoIdx, row); }
  );
}
function doDeletePhoto(secIdx, photoIdx, row){
  var sec = CHECKLIST_SECTIONS[secIdx];
  var recordId = CURRENT_DETAIL_ID;
  ZOHO.CREATOR.DATA.deleteRecordById({ report_name: PHOTO_REPORT, id: String(row.ID) })
    .then(function(delResp){
      if(!(delResp && delResp.code===3000)) console.warn('[FieldServiceSiteVisits] deleteRecordById failed', JSON.stringify(delResp));
      return ZOHO.CREATOR.DATA.updateRecordById({
        report_name: REPORT_NAME,
        id: String(recordId),
        payload: { data: (function(){ var d={}; d[sec.photo]=''; return d; })() }
      }).catch(function(nativeErr){
        console.warn('[FieldServiceSiteVisits] native clear failed', nativeErr);
      });
    })
    .then(function(){
      showToast('Photo removed');
      return loadSectionPhotos(recordId);
    })
    .then(function(){
      renderSectionPhotoStrip(secIdx);
      if(document.getElementById('lightboxOverlay').classList.contains('open')) closeLightbox();
    })
    .catch(function(err){
      console.error('[FieldServiceSiteVisits] deletePhoto error', err);
      showToast('Remove failed — see console');
    });
}

/* ════════════════════════════════
   CONFIRM MODAL — small in-app Yes/No dialog, not native browser confirm(). Built
   dynamically once and reused. FIXED 2026-07-22: originally used Tailwind's
   arbitrary `z-[90]` class, which never actually got generated by the precompiled
   Tailwind build (this widget's CSS is compiled ahead of time from the literal
   classes present in the source — a class only ever constructed at runtime inside a
   JS string is a much less reliable case for arbitrary-bracket values specifically)
   — the overlay ended up with no real z-index and rendered BEHIND the detail modal's
   own z-50. Rewritten in plain CSS (`.confirm-overlay`/`.confirm-box`, see <style>
   block), same proven approach already used for `.lightbox-overlay`.
════════════════════════════════ */
var CONFIRM_MODAL_ACTION = null;
function showConfirmModal(title, msg, onConfirm){
  var overlay = document.getElementById('confirmOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'confirmOverlay';
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = '<div class="confirm-box">' +
      '<div class="confirm-title" id="confirmTitle"></div>' +
      '<div class="confirm-msg" id="confirmBody"></div>' +
      '<div class="confirm-actions">' +
        '<button type="button" class="confirm-btn confirm-btn-cancel" onclick="closeConfirmModal()">Cancel</button>' +
        '<button type="button" class="confirm-btn confirm-btn-ok" onclick="runConfirmModalAction()">Remove</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeConfirmModal(); });
  }
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = msg;
  CONFIRM_MODAL_ACTION = onConfirm;
  overlay.classList.add('open');
}
function closeConfirmModal(){
  var overlay = document.getElementById('confirmOverlay');
  if(overlay) overlay.classList.remove('open');
  CONFIRM_MODAL_ACTION = null;
}
function runConfirmModalAction(){
  var action = CONFIRM_MODAL_ACTION;
  closeConfirmModal();
  if(action) action();
}

function uploadSectionPhotos(secIdx){
  var sec = CHECKLIST_SECTIONS[secIdx];
  var input = document.getElementById('photoInput' + secIdx);
  if(!CURRENT_DETAIL_ID || !sec || !input || !input.files || !input.files.length) return;
  if(typeof ZOHO==='undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.DATA || !ZOHO.CREATOR.FILE){
    showToast('Creator SDK not available'); return;
  }
  var files = Array.prototype.slice.call(input.files);
  var recordId = CURRENT_DETAIL_ID;
  showToast('Uploading ' + files.length + ' photo' + (files.length>1?'s':'') + '…');

  var chain = files.reduce(function(p, file){
    return p.then(function(){
      return ZOHO.CREATOR.DATA.addRecords({
        form_name: PHOTO_FORM,
        payload: { data: { Record_ID: String(recordId), Section1: sec.photo, File_Name: file.name, Uploaded_On: nowDateTimeStr() } }
      }).then(function(addResp){
        var newId = addResp && addResp.data && addResp.data.ID;
        if(!newId){ console.warn('[FieldServiceSiteVisits] addRecords(Site_Visit_Photos) failed', JSON.stringify(addResp)); return; }
        return ZOHO.CREATOR.FILE.uploadFile({
          report_name: PHOTO_REPORT,
          id: String(newId),
          field_name: 'Photo',
          file: file
        }).then(function(ur){
          if(!(ur && ur.code===3000)) console.warn('[FieldServiceSiteVisits] uploadFile(Photo) failed', JSON.stringify(ur));
          /* Mirror the same file onto the native single-file Photo field too, per user
             request 2026-07-22 ("widget and native needs to be working as same") — the
             native field can only ever hold ONE file, so on a multi-photo upload it ends
             up showing whichever file was uploaded LAST in this batch (expected, not a
             bug — Evidence_Photos above remains the full/authoritative multi-photo set,
             this is just a "latest photo" mirror so native isn't stuck showing stale/no
             data). Best-effort — a failure here doesn't roll back the Evidence_Photos
             upload, which is the one that actually matters for the widget's own view. */
          return ZOHO.CREATOR.FILE.uploadFile({
            report_name: REPORT_NAME,
            id: String(recordId),
            field_name: sec.photo,
            file: file
          }).catch(function(nativeErr){
            console.warn('[FieldServiceSiteVisits] native mirror upload failed', nativeErr);
          });
        });
      });
    });
  }, Promise.resolve());

  chain.then(function(){
    input.value = '';
    showToast('Photo' + (files.length>1?'s':'') + ' uploaded');
    return loadSectionPhotos(recordId);
  }).then(function(){
    renderSectionPhotoStrip(secIdx);
  }).catch(function(err){
    console.error('[FieldServiceSiteVisits] upload chain error', err);
    showToast('Upload failed — see console');
  });
}

function saveDetailChanges(){

  var btnTop = document.getElementById('btnSaveDetailModalTop');
  var btnBottom = document.getElementById('btnSaveDetailModalBottom');
  if(btnTop) { btnTop.disabled = true; btnTop.textContent = 'Saving…'; }
  if(btnBottom) { btnBottom.disabled = true; btnBottom.textContent = 'Saving…'; }

  function getChecked(name){
    var els = document.querySelectorAll('input[name="' + name + '"]:checked');
    var arr = [];
    els.forEach(function(el){ arr.push(el.value); });
    return arr;

  var data = {};

  data.Ceiling_Height = document.getElementById('edit_Ceiling_Height').value.trim();
  data.Mount_Height_from_Floor = document.getElementById('edit_Mount_Height_from_Floor').value.trim();
  data.Power_Source_Type = document.getElementById('edit_Power_Source_Type').value;
  data.Remarks = document.getElementById('edit_Remarks').value.trim();

  data.Prepare_the_Mounting_Surface = getChecked('chk_sec_1');
  data.Surface_Type = document.getElementById('edit_Surface_Type').value;
  data.Remarks1 = document.getElementById('edit_Remarks1').value.trim();

  data.Electrical_Check = getChecked('chk_sec_2');
  data.Voltage = document.getElementById('edit_Voltage').value.trim();
  data.Breaker_Size_if_known = document.getElementById('edit_Breaker_Size_if_known').value.trim();
  data.Remarks2 = document.getElementById('edit_Remarks2').value.trim();

  data.Ceiling_Structure_Check = getChecked('chk_sec_3');
  data.Remarks3 = document.getElementById('edit_Remarks3').value.trim();

  data.Safety_Access_Check = getChecked('chk_sec_4');
  data.Remarks4 = document.getElementById('edit_Remarks4').value.trim();

  data.Site_Delivery_Ch = getChecked('chk_sec_5');
  data.Remarks5 = document.getElementById('edit_Remarks5').value.trim();

  data.Client_Confirmation = getChecked('chk_sec_6');
  data.Notes_Remarks = document.getElementById('edit_Notes_Remarks').value.trim();

  data.Final_Check_Sign_off = getChecked('chk_sec_7');

  var clientName = document.getElementById('edit_Client_Name').value.trim();
  if(clientName){
    var parts = clientName.split(/\s+/);
    var fn = parts[0] || '';
    var ln = parts.slice(1).join(' ') || '';
    data.Name = { first_name: fn, last_name: ln };
  }

  ZOHO.CREATOR.DATA.updateRecordById({
    report_name: REPORT_NAME,
    id: String(CURRENT_DETAIL_ID),
    payload: { data: data }
  }).then(function(resp){
    var ok = resp && (resp.code===3000 || String(resp.code)==='3000');
    if(!ok){
      var msg = describeSaveError(resp);
      showToast('Save failed (code ' + (resp && resp.code) + ') — ' + msg, 6000);
      if(btnTop) { btnTop.disabled = false; btnTop.textContent = 'Save'; }
      if(btnBottom) { btnBottom.disabled = false; btnBottom.textContent = 'Save Changes'; }
      return;
    }
    Object.keys(data).forEach(function(k){ r[k] = data[k]; });
    r.Site_Delivery_Check = data.Site_Delivery_Ch;
    if(data.Name) r.Name = data.Name;

    return uploadDrawnSignatures(CURRENT_DETAIL_ID).then(function(sigResult){
      if(sigResult.failed) showToast('Checklist saved, but ' + sigResult.failed + ' signature upload(s) failed - see console', 6000);
      else showToast(sigResult.uploaded ? 'Site Visit and signature saved!' : 'Site Visit updated successfully!');
      return sigResult.uploaded ? refreshRecord(CURRENT_DETAIL_ID) : null;
    }).then(function(){
      IS_EDIT_MODE = false;
      renderStats();
      renderList();
      renderDetailView();
    });
  }).catch(function(e){
    var c = errCode(e);
    var msg = describeSaveError(e);
    showToast('Save failed' + (c ? (' (code ' + c + ')') : '') + ' — ' + msg, 6000);
    console.error('[FieldServiceSiteVisits] save error', e);
    if(btnTop) { btnTop.disabled = false; btnTop.textContent = 'Save'; }
    if(btnBottom) { btnBottom.disabled = false; btnBottom.textContent = 'Save Changes'; }
  });
}

/* ════════════════════════════════
   SIGNATURE PADS — added 2026-09-25. Same proven pattern as
   Widget/Fulfillment/QC Checklist: draw on a canvas, convert to a PNG File, upload
   with ZOHO.CREATOR.FILE.uploadFile (the Data API payload can't carry file bytes).
   Only uploads a pad the user actually drew on — otherwise the existing signature
   is left untouched.
════════════════════════════════ */
var SIG_FIELDS = { client: 'Client_Representative_Signature', tech: 'Signature' };
var SIG_DIRTY = {};

function initSigPad(key){
  var canvas = document.getElementById('sigPad_' + key);
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var drawing = false, last = null;
  SIG_DIRTY[key] = false;
  function size(){
    var rect = canvas.getBoundingClientRect();
    var ratio = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, rect.width * ratio);
    canvas.height = Math.max(1, rect.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1e293b';
  }
  function pt(ev){
    var rect = canvas.getBoundingClientRect();
    var t = ev.touches && ev.touches[0];
    return { x: (t ? t.clientX : ev.clientX) - rect.left, y: (t ? t.clientY : ev.clientY) - rect.top };
  }
  function start(ev){ ev.preventDefault(); drawing = true; last = pt(ev); }
  function move(ev){
    if(!drawing) return;
    ev.preventDefault();
    var p = pt(ev);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; SIG_DIRTY[key] = true;
  }
  function end(){ drawing = false; last = null; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  canvas._sigSize = size;
  size();
}

function clearSigPad(key){
  var canvas = document.getElementById('sigPad_' + key);
  if(!canvas) return;
  if(canvas._sigSize) canvas._sigSize();
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  SIG_DIRTY[key] = false;
}

function sigPadToFile(key){
  return new Promise(function(resolve){
    var canvas = document.getElementById('sigPad_' + key);
    if(!canvas || !SIG_DIRTY[key]) return resolve(null);
    canvas.toBlob(function(blob){
      resolve(blob ? new File([blob], key + '_signature.png', { type: 'image/png' }) : null);
    }, 'image/png');
  });
}

function uploadDrawnSignatures(recordId){
  var result = { uploaded: 0, failed: 0 };
  if(typeof ZOHO==='undefined' || !ZOHO.CREATOR || !ZOHO.CREATOR.FILE) return Promise.resolve(result);
  return Object.keys(SIG_FIELDS).reduce(function(p, key){
    return p.then(function(){ return sigPadToFile(key); }).then(function(file){
      if(!file) return;
      return ZOHO.CREATOR.FILE.uploadFile({
        report_name: REPORT_NAME,
        id: String(recordId),
        field_name: SIG_FIELDS[key],
        file: file
      }).then(function(resp){
        if(resp && (resp.code===3000 || String(resp.code)==='3000')) result.uploaded++;
        else { result.failed++; console.warn('[FieldServiceSiteVisits] signature upload failed', SIG_FIELDS[key], JSON.stringify(resp)); }
      }).catch(function(err){
        result.failed++;
        console.error('[FieldServiceSiteVisits] signature upload error', SIG_FIELDS[key], err);
      });
    });
  }, Promise.resolve()).then(function(){ return result; });
}

// Re-read one record so newly uploaded signature URLs show in View mode.
function refreshRecord(id){
  return ZOHO.CREATOR.DATA.getRecordById({ report_name: REPORT_NAME, id: String(id) })
    .then(function(resp){
      if(!(resp && resp.code===3000 && resp.data)) return;
      var idx = ALL_ROWS.findIndex(function(x){ return String(x.ID)===String(id); });
      if(idx >= 0) ALL_ROWS[idx] = Object.assign({}, ALL_ROWS[idx], resp.data);
    })
    .catch(function(err){ console.warn('[FieldServiceSiteVisits] refreshRecord failed', err); });
}

/* ════════════════════════════════
   LIGHTBOX — stack viewer, Prev/Next + X close, scoped to the section whose thumbnail
   was clicked (matches the checklist's own per-section photo grouping).
════════════════════════════════ */
function openSingleImageLightbox(url){
  if(!url) return;
  LIGHTBOX_ROWS = [{ Photo: url }];
  LIGHTBOX_IDX = 0;
  document.getElementById('lightboxOverlay').classList.add('open');
  renderLightboxImage();
}

function openLightbox(secIdx, photoIdx){
  LIGHTBOX_ROWS = SECTION_PHOTOS[secIdx] || [];
  LIGHTBOX_IDX = photoIdx;
  if(!LIGHTBOX_ROWS.length) return;
  document.getElementById('lightboxOverlay').classList.add('open');
  renderLightboxImage();
}
function renderLightboxImage(){
  var row = LIGHTBOX_ROWS[LIGHTBOX_IDX];
  if(!row) return;
  applyCreatorImage(document.getElementById('lbImg'), row.Photo);
  document.getElementById('lbCounter').textContent = (LIGHTBOX_IDX+1) + ' / ' + LIGHTBOX_ROWS.length;
  document.getElementById('lbPrev').style.visibility = LIGHTBOX_IDX > 0 ? 'visible' : 'hidden';
  document.getElementById('lbNext').style.visibility = LIGHTBOX_IDX < LIGHTBOX_ROWS.length-1 ? 'visible' : 'hidden';
}
function lightboxStep(delta){
  var next = LIGHTBOX_IDX + delta;
  if(next < 0 || next >= LIGHTBOX_ROWS.length) return;
  LIGHTBOX_IDX = next;
  renderLightboxImage();
}
function closeLightbox(){
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.getElementById('lbImg').src = '';
  LIGHTBOX_ROWS = [];
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(document.getElementById('lightboxOverlay').classList.contains('open')) closeLightbox();
    else if(document.getElementById('confirmOverlay') && document.getElementById('confirmOverlay').classList.contains('open')) closeConfirmModal();
    // In Edit mode Escape does nothing, so unsaved checklist edits aren't lost by accident.
    else if(document.getElementById('detailModal').classList.contains('show') && !IS_EDIT_MODE) closeDetail();
  } else if(document.getElementById('lightboxOverlay').classList.contains('open')){
    if(e.key==='ArrowLeft') lightboxStep(-1);
    else if(e.key==='ArrowRight') lightboxStep(1);
  }
});
</script>
